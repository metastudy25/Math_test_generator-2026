<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이든X · 문제은행 생성기</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eef1f7;color:#1e2535;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:root{
  --nv:#1a2f52;--nv2:#243b6a;--bl:#2563eb;--bl2:#1d4ed8;
  --gd:#c9a227;--gn:#16a34a;--rd:#dc2626;--og:#ea580c;
  --bg:#eef1f7;--ca:#fff;--br:#d6dce8;--mu:#64748b;--lt:#f8fafc;
  --s1:0 2px 10px rgba(26,47,82,.09);--s2:0 8px 30px rgba(26,47,82,.15);--r:10px
}
.scr{display:none}
.scr.on{display:block}
#sl.on{display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#0c1a30 0%,#1a2f52 50%,#1e3870 100%)}
#sa.on,#ss.on{display:flex;flex-direction:column;min-height:100vh}

/* LOGIN */
.lc{background:#fff;border-radius:20px;width:420px;max-width:96vw;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.lh{background:linear-gradient(135deg,#1a2f52,#2d4a80);padding:38px 34px 28px;text-align:center}
.lb{font-size:36px;font-weight:900;letter-spacing:3px;color:#fff}
.lb em{color:var(--gd);font-style:normal}
.ls{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:1.5px}
.lbody{padding:28px 32px 32px}
.ltabs{display:flex;background:#f0f4f9;border-radius:8px;padding:3px;margin-bottom:20px;gap:3px}
.lt{flex:1;padding:9px;border:none;border-radius:6px;background:transparent;
  font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;transition:all .2s}
.lt.on{background:var(--nv);color:#fff;box-shadow:0 2px 8px rgba(26,47,82,.22)}
.fi{margin-bottom:14px}
.fi label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px}
.fi input{width:100%;padding:11px 13px;border:2px solid var(--br);border-radius:7px;
  font-size:14.5px;outline:none;background:var(--lt);transition:border-color .2s}
.fi input:focus{border-color:var(--bl);background:#fff}
.btn-lg{width:100%;padding:13px;background:var(--nv);color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
.btn-lg:hover{background:var(--bl2);transform:translateY(-1px)}
.lerr{color:var(--rd);font-size:12px;text-align:center;margin-top:9px;min-height:16px;font-weight:600}

/* TOPBAR */
.tb{background:var(--nv);height:54px;padding:0 20px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.18);
  position:sticky;top:0;z-index:200}
.tb-br{font-size:15px;font-weight:900;color:#fff;letter-spacing:.5px}
.tb-br em{color:var(--gd);font-style:normal}
.tb-r{display:flex;align-items:center;gap:9px}
.tw{font-size:12px;color:rgba(255,255,255,.6)}
.btn-out{padding:5px 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:6px;
  background:transparent;color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-out:hover{background:rgba(255,255,255,.12)}

/* ADMIN */
.ash{display:flex;flex:1;min-height:calc(100vh - 54px)}
.aside{width:196px;background:#fff;border-right:1px solid var(--br);padding:12px 0;flex-shrink:0}
.asec{font-size:9.5px;font-weight:800;color:#b0bcc8;text-transform:uppercase;letter-spacing:1.2px;padding:11px 16px 4px}
.ai{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;
  font-weight:500;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all .13s}
.ai:hover{background:#f0f5fc;color:var(--nv)}
.ai.on{color:var(--bl);background:#eff4ff;border-left-color:var(--bl);font-weight:700}
.amain{flex:1;padding:22px;overflow-y:auto;background:var(--bg)}

/* STUDENT NAV */
.snav{background:#fff;border-bottom:2px solid var(--br);display:flex;padding:0 16px;overflow-x:auto;flex-shrink:0}
.snb{padding:12px 15px;border:none;background:transparent;font-size:13px;
  font-weight:600;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;
  margin-bottom:-2px;white-space:nowrap;transition:all .13s}
.snb.on{color:var(--bl);border-bottom-color:var(--bl)}
.sbody{flex:1;overflow-y:auto;background:var(--bg)}
.sin{padding:20px;max-width:980px;margin:0 auto}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--br);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--s1)}
.ct{font-size:13.5px;font-weight:800;color:var(--nv);margin-bottom:13px;
  display:flex;align-items:center;gap:6px}
.ct::after{content:'';flex:1;height:1px;background:var(--br);margin-left:7px}
.pgh{margin-bottom:18px}
.pgt{font-size:19px;font-weight:900;color:var(--nv)}
.pgs{font-size:12.5px;color:var(--mu);margin-top:3px}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.sb{background:#fff;border-radius:var(--r);border:1px solid var(--br);padding:15px 17px;box-shadow:var(--s1)}
.sbn{font-size:26px;font-weight:900;line-height:1}
.sbl{font-size:11px;color:var(--mu);margin-top:4px}
.cn .sbn{color:var(--nv)}.cb .sbn{color:var(--bl)}.cg .sbn{color:var(--gd)}.cs .sbn{color:var(--gn)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;
  border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.bn{background:var(--nv);color:#fff}.bb{background:var(--bl);color:#fff}
.bg{background:var(--gn);color:#fff}.br{background:var(--rd);color:#fff}
.bgd{background:var(--gd);color:#fff}.bgy{background:#e2e8f0;color:var(--nv)}
.bsm{padding:5px 11px;font-size:11.5px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f0f4fa;padding:8px 11px;text-align:left;font-weight:700;
  color:var(--nv);border-bottom:2px solid var(--br)}
.tbl td{padding:8px 11px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.tbl tr:hover td{background:#f8fafc}

/* BADGES */
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;line-height:1.4}
.bnv{background:#e6edf8;color:#1a2f52}.bbl{background:#dbeafe;color:#1d4ed8}
.bgn{background:#dcfce7;color:#15803d}.brd{background:#fee2e2;color:#dc2626}
.bgd2{background:#fef3c7;color:#92400e}.bgy2{background:#f1f5f9;color:#475569}

/* DROPZONE */
.dz{border:2.5px dashed #93c5fd;border-radius:12px;padding:38px 24px;text-align:center;
  cursor:pointer;transition:all .2s;background:#f0f7ff;margin-bottom:12px}
.dz:hover,.dz.over{border-color:var(--bl);background:#dbeafe}
.dz-ic{font-size:42px;margin-bottom:9px}
.dz-t{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:4px}
.dz-s{font-size:12.5px;color:var(--mu)}

/* TOAST */
.toast{position:fixed;top:14px;right:14px;padding:10px 16px;border-radius:9px;
  font-size:13px;font-weight:600;z-index:9999;opacity:0;
  transform:translateY(-8px);transition:all .22s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateY(0)}
.tok{background:var(--gn);color:#fff}.terr{background:var(--rd);color:#fff}.tinf{background:var(--nv);color:#fff}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:500;
  display:none;align-items:center;justify-content:center;padding:16px}
.mo.open{display:flex}
.mob{background:#fff;border-radius:14px;padding:26px 28px;width:100%;
  max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mot{font-size:16px;font-weight:900;color:var(--nv);margin-bottom:16px}
.mof{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* FORM */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:2px solid var(--br);border-radius:7px;font-size:13px;outline:none;background:var(--lt);transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--bl);background:#fff}
.fg textarea{resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px}
.empty .ei{font-size:46px;margin-bottom:11px}
.empty p{font-size:14.5px;font-weight:600;color:var(--mu)}

/* ── EXAM SHEET ── */
.ew{max-width:960px;margin:0 auto}

/* Timer */
.tbar{background:#fff;border:1px solid var(--br);border-radius:10px;
  padding:11px 16px;margin-bottom:12px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:var(--s1);flex-wrap:wrap;gap:8px}
.tinfo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tclock{font-size:20px;font-weight:900;color:var(--nv);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:5px}
.tclock.warn{color:var(--rd);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pinfo{font-size:13px;color:var(--mu)}
.pinfo strong{color:var(--nv);font-size:14px}
.rem{background:#fff8e1;border:1.5px solid var(--gd);border-radius:20px;
  padding:3px 12px;font-size:11.5px;font-weight:700;color:#92400e}
.tbtns{display:flex;gap:7px;flex-wrap:wrap}
.btn-sub{padding:10px 26px;background:var(--nv);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
.btn-sub:hover{background:var(--bl);transform:translateY(-1px)}

/* Paper */
.paper{background:#fff;box-shadow:var(--s2)}
.phdr{border:2.5px solid #111;border-bottom:1.5px solid #888;padding:13px 18px}
.pht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.psch{font-size:12px;font-weight:800;color:var(--nv)}
.ptit{font-size:19px;font-weight:900;letter-spacing:2px;color:#111;text-align:center;flex:1;margin:0 14px}
.pdat{font-size:11px;color:#777;white-space:nowrap}
.pir{display:flex;align-items:center;justify-content:space-between}
.istrip{display:flex;border:1.5px solid #333}
.ic{display:flex;align-items:center;gap:5px;padding:4px 10px;border-right:1.5px solid #333}
.ic:last-child{border-right:none}
.ic lbl{font-size:10px;font-weight:800;color:#555;white-space:nowrap}
.ifl{border:none;border-bottom:1.5px solid #333;outline:none;font-family:inherit;font-size:12.5px;background:transparent;min-width:50px;padding:1px 3px}
.ptot{font-size:12px;color:#777}
.pbody{border:2.5px solid #111;border-top:none;padding:16px 18px}

/* 2-col */
.p2c{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.pb{padding:12px 0;border-bottom:1px dashed #ccd3e0}
.pb:last-child{border-bottom:none}
.prow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.pnc{width:22px;height:22px;border-radius:50%;background:var(--nv);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ptxt{font-size:13.5px;line-height:1.7;flex:1}
.ppts{font-size:10.5px;color:#888;margin-left:5px;font-weight:600}
.pmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.sdiv{grid-column:1/-1;padding:9px 0 4px;font-size:12.5px;font-weight:800;color:var(--nv);
  border-top:2px solid var(--nv);margin-top:6px}

/* Choices */
.cl{list-style:none;padding-left:30px;margin-top:6px}
.ci{display:flex;align-items:flex-start;gap:7px;padding:4px 5px;border-radius:6px;
  cursor:pointer;font-size:13px;line-height:1.5;transition:background .11s;user-select:none;margin-bottom:2px}
.ci:hover:not(.fz){background:#f0f5ff}
.ci.sel{background:#dbeafe}
.ci.corr{background:#dcfce7!important}
.ci.wrng{background:#fee2e2!important}
.cc{width:20px;height:20px;border-radius:50%;border:1.5px solid #bbb;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:800;flex-shrink:0;color:#666;background:#fff;transition:all .11s}
.ci.sel .cc{background:var(--bl);border-color:var(--bl);color:#fff}
.ci.corr .cc{background:var(--gn);border-color:var(--gn);color:#fff}
.ci.wrng .cc{background:var(--rd);border-color:var(--rd);color:#fff}

/* Subj / Essay */
.sja{padding-left:30px;margin-top:8px}
.sji{padding:7px 10px;border:2px solid var(--br);border-radius:6px;
  font-size:13.5px;outline:none;width:100%;max-width:260px;transition:border-color .2s}
.sji:focus{border-color:var(--bl)}
.sji.corr{border-color:var(--gn);background:#f0fdf4}
.sji.wrng{border-color:var(--rd);background:#fff5f5}
.esa{padding-left:30px;margin-top:8px}
.esi{padding:8px 11px;border:2px solid var(--br);border-radius:6px;
  font-size:13px;outline:none;width:100%;min-height:80px;resize:vertical;
  line-height:1.6;transition:border-color .2s}
.esi:focus{border-color:var(--bl)}
.esi.corr{border-color:var(--gn);background:#f0fdf4}
.esi.wrng{border-color:var(--rd);background:#fff5f5}
/* Essay scoring hint */
.essay-hint{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fbbf24;
  border-radius:5px;padding:4px 9px;margin-top:6px;margin-left:30px;display:inline-block}

/* Solution */
.sol{margin:8px 0 2px 30px;background:#fffbeb;border:1px solid #fbbf24;
  border-radius:8px;padding:10px 12px;font-size:12px;display:none}
.sol.vis{display:block}
.sv{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.sv.ok{color:var(--gn)}.sv.ng{color:var(--rd)}
.sa{font-size:13.5px;font-weight:800;color:var(--gn);margin-bottom:5px}
.se{color:#374151;line-height:1.65;font-size:12px}

/* Result */
.resb{background:linear-gradient(135deg,var(--nv),#2d4a80);color:#fff;
  border-radius:14px;padding:26px;text-align:center;margin:14px 0;box-shadow:var(--s2)}
.rsc{font-size:60px;font-weight:900;line-height:1}
.rsc sub{font-size:22px;font-weight:400;opacity:.7}
.rpc{font-size:20px;font-weight:700;margin-top:5px}
.rmsg{font-size:15px;margin-top:7px;opacity:.85}
.pbo{background:rgba(255,255,255,.2);border-radius:5px;height:8px;max-width:240px;margin:11px auto 0;overflow:hidden}
.pbi{height:100%;border-radius:5px;transition:width .5s}

/* Wrong note */
.wni{background:#fff;border:2px solid #fecaca;border-radius:12px;
  padding:14px 16px;margin-bottom:11px;box-shadow:var(--s1)}
.wnh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.wcnt{background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px}

/* Conquest */
.cqc{background:#fff;border-radius:12px;border:1px solid var(--br);
  padding:16px 18px;margin-bottom:11px;box-shadow:var(--s1)}
.cqh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cqn{font-size:14.5px;font-weight:800;color:var(--nv)}
.cqs{font-size:11.5px;color:var(--mu);margin-top:2px}
.cqbr{display:flex;align-items:center;gap:9px}
.cqbo{flex:1;background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden}
.cqbi{height:100%;border-radius:4px;transition:width .5s}
.cqp{font-size:14px;font-weight:900;min-width:36px;text-align:right}
.cqft{display:flex;gap:13px;margin-top:9px;font-size:12px;color:var(--mu)}

/* Home */
.hero{background:linear-gradient(135deg,#1a2f52,#2d4a80);border-radius:14px;
  padding:24px 26px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;box-shadow:var(--s2);color:#fff;flex-wrap:wrap;gap:12px}
.hn{font-size:20px;font-weight:900}
.hs2{font-size:12.5px;opacity:.7;margin-top:3px}
.hbig{font-size:46px;font-weight:900;text-align:center;line-height:1}
.hbig sub{font-size:17px;font-weight:400;opacity:.7}
.hlbl{font-size:11px;opacity:.65;text-align:center;margin-top:3px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.hst{background:#fff;border-radius:var(--r);border:1px solid var(--br);padding:14px 16px;text-align:center;box-shadow:var(--s1)}
.hst .n{font-size:24px;font-weight:900}
.hst .l{font-size:11.5px;color:var(--mu);margin-top:4px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ac{background:#fff;border-radius:12px;border:2px solid var(--br);
  padding:16px 18px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.ac:hover{border-color:var(--bl);transform:translateY(-2px);box-shadow:var(--s2)}
.acic{font-size:24px;margin-bottom:7px}
.act{font-size:14.5px;font-weight:800;color:var(--nv);margin-bottom:4px}
.acd{font-size:12px;color:var(--mu)}

/* Set card */
.setc{background:#fff;border-radius:12px;border:2px solid var(--br);
  padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.setc:hover{border-color:var(--bl);box-shadow:var(--s2)}
.setn{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:5px}

/* Upload ok */
.upok{padding:13px 15px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:9px;font-size:13px;margin-top:11px}

/* Code */
.cpre{background:#1e2535;border-radius:8px;padding:13px;overflow-x:auto;margin-top:7px}
.cpre code{color:#a8ff78;font-family:monospace;font-size:11.5px;line-height:1.75;white-space:pre}

/* Print */
@media print{
  .tb,.aside,.snav,.tbar,.noprint{display:none!important}
  .pbody{border-top:2.5px solid #111}
  .pb{page-break-inside:avoid}
  .sol{display:block!important}
  body{background:#fff}
  .ew{max-width:100%}
}
@media(max-width:768px){
  .p2c{grid-template-columns:1fr}
  .sg,.hg{grid-template-columns:1fr 1fr}
  .ag{grid-template-columns:1fr}
  .ash{flex-direction:column}
  .aside{width:100%;border-right:none;border-bottom:1px solid var(--br)}
  .r2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ═══ LOGIN ═══ -->
<div class="scr" id="sl">
<div class="lc">
  <div class="lh">
    <div class="lb">EDEN <em>X</em></div>
    <div class="ls">문제은행 · 학습시스템</div>
  </div>
  <div class="lbody">
    <div class="ltabs">
      <button class="lt on" id="lt-s" onclick="swTab('s')">학생 로그인</button>
      <button class="lt" id="lt-a" onclick="swTab('a')">관리자</button>
    </div>
    <div id="lf-s">
      <div class="fi"><label>이름</label>
        <input id="s-nm" placeholder="이름 입력" onkeydown="if(event.key==='Enter')sLogin()">
      </div>
      <div class="fi"><label>비밀번호</label>
        <input id="s-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')sLogin()">
      </div>
      <button class="btn-lg" onclick="sLogin()">로그인 →</button>
    </div>
    <div id="lf-a" style="display:none">
      <div class="fi"><label>관리자 ID</label><input id="a-id" value="eden"></div>
      <div class="fi"><label>비밀번호</label>
        <input id="a-pw" type="password" placeholder="eden2026" onkeydown="if(event.key==='Enter')aLogin()">
      </div>
      <button class="btn-lg" onclick="aLogin()">관리자 입장 →</button>
    </div>
    <div class="lerr" id="lerr"></div>
  </div>

function readAuto(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    let txt=e.target.result;
    const garbled=(txt.match(/[^\u0000-\u00FF\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g)||[]).length;
    const kor=(txt.match(/[\uAC00-\uD7AF]/g)||[]).length;
    if(garbled>30&&kor<5){
      const r2=new FileReader();
      r2.onload=e2=>cb(e2.target.result);
      r2.onerror=()=>cb(txt);
      try{r2.readAsText(file,'EUC-KR');}catch(ex){cb(txt);}
    }else cb(txt);
  };
  r.onerror=()=>cb('');
  r.readAsText(file,'UTF-8');
}

function parseTxt(raw){
  // 제목
  let name='';
  const tm=raw.match(/([^\n]{5,60}(?:고사|평가|모의|확인)[^\n]*)/);
  if(tm) name=tm[1].replace(/[#*_`\[\]]/g,'').replace(/^[IVX]+\.\s*/,'').trim();
  if(!name) name='업로드 문제집';

  let grade='', type='단원평가', school='';
  const gm=raw.match(/(\d)학년/);if(gm) grade='중'+gm[1];
  if(/중간고사/.test(raw)) type='중간고사';
  else if(/기말고사/.test(raw)) type='기말고사';
  else if(/모의/.test(raw)) type='모의고사';
  const sm=raw.match(/([가-힣]+중학교|[가-힣]+고등학교)/);if(sm) school=sm[1];

  const probs=[];

  // 객관식: 번호. 문제 (점수) ①②③④⑤
  const objRe=/(\d+)\.\s+([\s\S]+?)(?=\n\d+\.|$)/g;
  // 먼저 PART1 추출
  const p1=raw.match(/PART\s*1[\s\S]*?(?=PART\s*2|III\.|주관식|서술형|$)/i)||[raw];
  const p2=raw.match(/PART\s*2[\s\S]*?(?=IV\.|정답|$)/i)||[''];

  function parseBlock(block, typeFn){
    const re=/(\d+)\.\s+([\s\S]+?)(?=\n\n\d+\.|\n\d+\.\s+[\[①]|$)/g;
    let m;
    while((m=re.exec(block))!==null){
      const no=parseInt(m[1]);
      if(no<1||no>100) continue;
      const body=m[2];
      const ptsM=body.match(/\((\d+)점\)/);
      const pts=ptsM?parseInt(ptsM[1]):4;
      let q=body.replace(/\(\d+점\)/,'')
                .replace(/\[성취기준[^\]]*\]/g,'')
                .replace(/\[채점\s*기준표\][\s\S]*/,'')
                .replace(/정답:\s*[^\n]*/gi,'').trim();

      const chs=[];
      for(const cx of q.matchAll(/[①②③④⑤]\s*([^①②③④⑤\n]+)/g))
        chs.push(cx[1].replace(/\s+/g,' ').trim());
      q=q.replace(/[①②③④⑤][^①②③④⑤\n]*/g,'').replace(/\s+/g,' ').trim();

      const ptype=typeFn(body,chs);
      if(!q) continue;

      probs.push({id:uid(),type:ptype,no,q,choices:chs,ans:'',pts,diff:pts>=7?'상':pts>=5?'중':'하',tag:'',exp:''});
    }
  }
  parseBlock(p1[0],(b,c)=>c.length>=2?'obj':'subj');
  parseBlock(p2[0],(b)=>/서술형/.test(b)?'essay':'subj');

  if(!probs.length){
    // fallback: 전체 파싱
    parseBlock(raw,(b,c)=>{
      if(/서술형/.test(b)) return 'essay';
      if(/단답형/.test(b)) return 'subj';
      return c.length>=2?'obj':'subj';
    });
  }

  // 정답표 파싱
  const ansSection=raw.match(/정답표?[\s\S]{0,1000}/i)||raw.match(/\[정답\][\s\S]{0,1000}/i)||[''];
  const ansLines=ansSection[0].split('\n');
  probs.forEach(p=>{
    if(p.ans) return;
    for(const ln of ansLines){
      const am=ln.match(new RegExp('\\b'+p.no+'\\s+([①②③④⑤\\d][^\\s|]*?)(?:\\s|$)'));
      if(am){
        let a=am[1].trim();
        const idx='①②③④⑤'.indexOf(a);
        if(idx>=0) a=String(idx+1);
        p.ans=a; break;
      }
    }
  });

  probs.sort((a,b)=>a.no-b.no);
  return {name,grade,type,school,problems:probs};
}

  if(!probs.length){toast('문제 없음','err');return;}
  APP.q={sid,probs,ans:{},done:false,wm:!!wps};
  startT();
  document.getElementById('sb').innerHTML=buildSheet();

function buildSheet(){
  const {sid,probs,done,wm}=APP.q;
  const set=DB.sets.find(s=>s.id===sid)||{name:'오답재도전',grade:'',type:''};
  const stu=APP.u;
  const now=new Date();
  const ds=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;

  const objPs=probs.filter(p=>p.type==='obj');
  const subPs=probs.filter(p=>p.type!=='obj');
  const totalPts=probs.reduce((a,p)=>a+(p.pts||4),0);
  let ep=0;
  if(done) probs.forEach(p=>{const a=APP.q.ans[p.id];if(chk(p,a)) ep+=(p.pts||4);});
  const pct=done?Math.round(ep/totalPts*100):0;
  const answered=Object.keys(APP.q.ans).length;
  const remain=probs.length-answered;

  const col0=objPs.filter((_,i)=>i%2===0);
  const col1=objPs.filter((_,i)=>i%2===1);

  function rP(p,gi){
    const a=APP.q.ans[p.id];
    const ok=done?chk(p,a):false;
    let inp='';
    if(p.type==='obj'){
      inp=`<ul class="cl">${p.choices.map((c,ci)=>{
        let cls='';
        if(done){if((ci+1)+''===p.ans)cls='corr';else if((ci+1)+''===a)cls='wrng';}
        else if(a===(ci+1)+'')cls='sel';
        return`<li class="ci ${cls}${done?' fz':''}"
          ${done?'':` onclick="pick('${p.id}','${ci+1}')"`}>
          <span class="cc">${LL[ci]}</span><span>${c}</span></li>`;
      }).join('')}</ul>`;
    }else if(p.type==='subj'){
      const c2=done?(ok?'corr':'wrng'):'';
      inp=`<div class="sja"><input class="sji ${c2}" id="si-${p.id}"
        value="${a||''}" placeholder="답 입력" ${done?'readonly':''}
        oninput="setA('${p.id}',this.value)"></div>`;
    }else{
      const c2=done?(ok?'corr':'wrng'):'';
      inp=`<div class="esa">
        <textarea class="esi ${c2}" id="si-${p.id}" placeholder="풀이 과정을 서술하세요"
          ${done?'readonly':''} oninput="setA('${p.id}',this.value)">${a||''}</textarea>
        ${!done?`<div class="essay-hint">📝 서술형: 풀이 과정과 결론을 완전한 문장으로 쓰세요 (${p.pts}점)</div>`:''}
      </div>`;
    }
    const solH=done?`<div class="sol vis">
      <div class="sv ${ok?'ok':'ng'}">${ok?'✅ 정답':'❌ 오답'}</div>
      ${p.ans&&p.ans!=='(해설 참조)'?`<div class="sa">정답: ${p.type==='obj'&&p.choices?.length?LL[parseInt(p.ans)-1]+' '+p.choices[parseInt(p.ans)-1]:p.ans}</div>`:''}
      ${p.exp?`<div class="se">${p.exp}</div>`:''}
    </div>`:'';
    return`<div class="pb" id="pb-${p.id}">
      <div class="prow">
        <div class="pnc">${gi+1}</div>
        <div class="ptxt">${p.q}<span class="ppts">(${p.pts||4}점)</span>
          <div class="pmeta">
            ${p.tag?`<span class="bdg bgy2" style="font-size:10px">${p.tag}</span>`:''}
            ${db(p.diff||'중')}
            <span class="bdg bgy2" style="font-size:10px">${p.type==='obj'?'객관식':p.type==='essay'?'서술형':'주관식'}</span>
          </div>
        </div>
      </div>${inp}${solH}</div>`;
  }

  const msg=pct>=90?'🏆 최우수! 완벽!':pct>=80?'🎉 우수! 훌륭해요!':pct>=60?'💪 보통. 오답 복습!':'📚 집중 복습 필요.';
  const resH=done?`<div class="resb">
    <div class="rsc">${ep}<sub>/${totalPts}점</sub></div>
    <div class="rpc">${pct}점 (${probs.length}문제)</div>
    <div class="rmsg">${msg}</div>
    <div class="pbo"><div class="pbi" style="width:${pct}%;background:${pc(pct)}"></div></div>
    ${pct<100?`<p style="margin-top:10px;font-size:13px;opacity:.8">❗ 틀린 ${probs.filter(p=>!chk(p,APP.q.ans[p.id])).length}문제 → <strong>틀린 것만 다시</strong>로 재도전!</p>`:''}
  </div>`:'';

  return`<div class="ew">
  <div class="tbar noprint">
    <div class="tinfo">
      <div class="tclock">⏱ <span id="tc">${fmtS(_ts)}</span></div>
      <div class="pinfo">답변 <strong>${answered}</strong>/${probs.length}
        ${!done?`<span class="rem" style="margin-left:7px">남은 ${remain}문제</span>`:''}
      </div>
    </div>
    <div class="tbtns">
      <button class="btn bgy bsm noprint" onclick="sp('quiz')">← 목록</button>
      <button class="btn bgy bsm noprint" onclick="window.print()">🖨 인쇄</button>
      ${!done
        ?`<button class="btn-sub" onclick="subQ()">📋 전체 답 확인</button>`
        :`<button class="btn br bsm noprint" onclick="retry()">↺ 틀린 것만 다시</button>
          <button class="btn bg bsm noprint" onclick="qSet('${sid}')">전체 다시</button>`}
    </div>
  </div>

  <div class="paper">
    <div class="phdr">
      <div class="pht">
        <div class="psch">이든X학원${set.grade?' | '+set.grade:''}</div>
        <div class="ptit">${wm?'오 답 재 도 전':set.name}</div>
        <div class="pdat">${ds}</div>
      </div>
      <div class="pir">
        <div class="istrip">
          <div class="ic"><lbl>좌석번호</lbl><input class="ifl" style="width:48px"></div>
          <div class="ic"><lbl>학&nbsp;&nbsp;&nbsp;년</lbl><input class="ifl" style="width:40px"></div>
          <div class="ic"><lbl>이&nbsp;&nbsp;&nbsp;름</lbl><input class="ifl" style="width:68px" value="${stu.n!=='미리보기'?stu.n:''}"></div>
        </div>
        <div class="ptot">총 ${probs.length}문제 / ${totalPts}점 만점</div>
      </div>
    </div>
    <div class="pbody">
      ${objPs.length?`<div class="p2c">
        <div>${col0.map((p,i)=>rP(p,i*2)).join('')}</div>
        <div>${col1.map((p,i)=>rP(p,i*2+1)).join('')}</div>
      </div>`:''}
      ${subPs.length?`<div class="sdiv">▣ 주관식 / 서술형</div>
        ${subPs.map((p,i)=>rP(p,objPs.length+i)).join('')}`:''}
    </div>
  </div>

  ${resH}
  ${done?`<div class="tbar noprint" style="margin-top:0">
    <span style="font-size:13px;color:var(--mu)">소요시간 <strong>${fmtT(_ts)}</strong> · <strong>${pct}점</strong></span>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn bgy bsm" onclick="sp('wrong')">오답노트 →</button>
      <button class="btn br bsm" onclick="retry()">↺ 틀린 것만</button>
      <button class="btn bn bsm" onclick="dlHTML()">📥 다운로드</button>
    </div>
  </div>`:''}
  </div>`;
}

function chk(p,a){
  if(!a) return false;
  if(p.type==='obj') return a===p.ans;
  if(p.type==='essay') return true; // 서술형: 입력하면 부분점수 처리
  return a.trim()===p.ans.trim();
}
function pick(pid,v){
  if(APP.q.done) return;
  APP.q.ans[pid]=v;
  const blk=document.getElementById('pb-'+pid);
  if(blk) blk.querySelectorAll('.ci').forEach((li,i)=>{
    const on=(i+1)+''===v;li.className='ci'+(on?' sel':'');
    const cc=li.querySelector('.cc');
    if(cc){cc.style.background=on?'var(--bl)':'';cc.style.borderColor=on?'var(--bl)':'';cc.style.color=on?'#fff':'';}
  });
  updCnt();
}
function setA(pid,v){if(APP.q.done)return;APP.q.ans[pid]=v;updCnt();}
function updCnt(){
  const a=Object.keys(APP.q.ans).length,tot=APP.q.probs.length,rem=tot-a;
  const el=document.querySelector('.pinfo');
  if(el) el.innerHTML=`답변 <strong>${a}</strong>/${tot} <span class="rem" style="margin-left:7px">남은 ${rem}문제</span>`;
}
function subQ(){
  const ua=APP.q.probs.filter(p=>!APP.q.ans[p.id]).length;
  if(ua&&!confirm(`${ua}문제 미응답입니다. 채점할까요?`)) return;
  stopT();APP.q.done=true;
  let ep=0,tot=0;
  APP.q.probs.forEach(p=>{tot+=(p.pts||4);if(chk(p,APP.q.ans[p.id]))ep+=(p.pts||4);});
  if(APP.u.id!=='__prev__'){
    const now=new Date();
    const dt=`${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    DB.recs.push({id:uid(),uid:APP.u.id,sid:APP.q.sid,dt,sc:ep,tot,tm:fmtT(_ts),
      ans:APP.q.probs.map(p=>({pid:p.id,cho:APP.q.ans[p.id]||'',ok:chk(p,APP.q.ans[p.id])}))});
    sdb();
  }
  toast(`채점 완료! ${ep}/${tot}점 ✅`,'ok');
  document.getElementById('sb').innerHTML=buildSheet();
}
function retry(){
  const wp=APP.q.probs.filter(p=>!chk(p,APP.q.ans[p.id]));
  if(!wp.length){toast('모두 정답! 🎉','ok');return;}
  APP.q={sid:APP.q.sid,probs:wp,ans:{},done:false,wm:true};
  startT();document.getElementById('sb').innerHTML=buildSheet();
}

// ──────────────────────────────────────────
//  WRONG NOTE
// ──────────────────────────────────────────
function rWrong(){
  const u=APP.u;const rs=DB.recs.filter(r=>r.uid===u.id);
  const wm={};rs.forEach(r=>r.ans?.forEach(a=>{if(!a.ok){if(!wm[a.pid])wm[a.pid]={cnt:0,sid:r.sid};wm[a.pid].cnt++;}}));
  const corr=new Set();rs.forEach(r=>r.ans?.forEach(a=>{if(a.ok&&wm[a.pid])corr.add(a.pid);}));
  const wp=Object.entries(wm).filter(([id])=>!corr.has(id)).map(([id,info])=>{
    const set=DB.sets.find(s=>s.id===info.sid);const p=set?.problems.find(pp=>pp.id===id);
    return p?{...p,cnt:info.cnt,sid:info.sid,setName:set.name}:null;
  }).filter(Boolean);
  if(!wp.length) return'<div class="empty"><div class="ei">🎉</div><p>오답 없음! 완벽합니다!</p></div>';
  return`<div style="margin-bottom:16px">
    <div class="pgt">❌ 오답노트</div>
    <div class="pgs">미정복 <strong>${wp.length}</strong>문제 · 100%까지 반복!</div>
    <button class="btn br" style="margin-top:10px" onclick="wQuiz()">오답만 다시 풀기 (${wp.length}문제) →</button>
  </div>
  ${wp.map(p=>`<div class="wni">
    <div class="wnh">
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <span class="bdg bnv">${p.setName}</span>
        ${p.tag?`<span class="bdg bgy2">${p.tag}</span>`:''}
        ${db(p.diff||'중')}
      </div>
      <span class="wcnt">틀린 횟수 ${p.cnt}</span>
    </div>
    <div style="font-size:14px;font-weight:700;margin-bottom:9px">${p.q}</div>
    ${p.type==='obj'&&p.choices?.length?`<ul style="list-style:none;padding-left:10px;font-size:13px;margin-bottom:9px">
      ${p.choices.map((c,i)=>`<li style="${(i+1)+''===p.ans?'color:var(--gn);font-weight:800':''}">${LL[i]} ${c}</li>`).join('')}
    </ul>`:''}
    <div class="sol vis" style="margin-left:0">
      <div class="sv ok">✅ 정답 및 해설</div>
      ${p.ans&&p.ans!=='(해설 참조)'?`<div class="sa">정답: ${p.type==='obj'&&p.choices?.length?LL[parseInt(p.ans)-1]+' '+p.choices[parseInt(p.ans)-1]:p.ans}</div>`:''}
      ${p.exp?`<div class="se">${p.exp}</div>`:''}
    </div>
  </div>`).join('')}`;
}
function wQuiz(){
  const u=APP.u;const rs=DB.recs.filter(r=>r.uid===u.id);
  const wm={};rs.forEach(r=>r.ans?.forEach(a=>{if(!a.ok)wm[a.pid]={sid:r.sid};}));
  const corr=new Set();rs.forEach(r=>r.ans?.forEach(a=>{if(a.ok&&wm[a.pid])corr.add(a.pid);}));
  const probs=[];
  Object.entries(wm).filter(([id])=>!corr.has(id)).forEach(([id,info])=>{
    const set=DB.sets.find(s=>s.id===info.sid);const p=set?.problems.find(pp=>pp.id===id);if(p)probs.push(p);
  });
  if(!probs.length){toast('오답 없음 🎉','ok');return;}
  APP.q={sid:probs[0].sid||'w',probs,ans:{},done:false,wm:true};
  startT();document.getElementById('sm-wrong').classList.remove('on');
  document.getElementById('sb').innerHTML=buildSheet();
}

// ──────────────────────────────────────────
//  CONQUEST
// ──────────────────────────────────────────
function rConq(){
  const u=APP.u;const rs=DB.recs.filter(r=>r.uid===u.id);
  if(!DB.sets.length) return'<div class="empty"><div class="ei">📭</div><p>문제집 없음</p></div>';
  return`<div style="margin-bottom:16px"><div class="pgt">🏆 정복 현황</div><div class="pgs">100%를 향해!</div></div>
  ${DB.sets.map(set=>{
    const tot=set.problems.length;if(!tot)return'';
    const srs=rs.filter(r=>r.sid===set.id);
    const sol=new Set();srs.forEach(r=>r.ans?.forEach(a=>{if(a.ok)sol.add(a.pid);}));
    const sc=set.problems.filter(p=>sol.has(p.id)).length;
    const pct=Math.round(sc/tot*100);
    const best=srs.reduce((b,r)=>(!b||r.sc/r.tot>b.sc/b.tot)?r:b,null);
    const stars=pct>=100?'⭐⭐⭐':pct>=80?'⭐⭐':pct>=50?'⭐':'📚';
    const c=pc(pct);
    return`<div class="cqc">
      <div class="cqh">
        <div><div class="cqn">${set.name}</div><div class="cqs">${set.grade||''} ${set.type||''} · ${tot}문제</div></div>
        <div style="font-size:14px">${stars}</div>
      </div>
      <div class="cqbr">
        <div class="cqbo"><div class="cqbi" style="width:${pct}%;background:${c}"></div></div>
        <div class="cqp" style="color:${c}">${pct}%</div>
      </div>
      <div class="cqft">
        <span>정복 <strong>${sc}</strong>/${tot}</span>
        <span>응시 <strong>${srs.length}</strong>회</span>
        ${best?`<span>최고 <strong>${Math.round(best.sc/best.tot*100)}점</strong></span>`:''}
      </div>
      ${pct<100
        ?`<button class="btn bn bsm" style="margin-top:9px" onclick="qSet('${set.id}')">계속 도전 →</button>`
        :'<div style="color:var(--gn);font-weight:800;margin-top:9px">🎊 완전 정복!</div>'}
    </div>`;
  }).join('')}`;
}

// ──────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>scr('sl'));
</script>
</body>
</html>
