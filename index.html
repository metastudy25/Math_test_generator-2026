<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이든X · 문제은행</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕",sans-serif;background:#eef1f7;color:#1e2535;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:root{
  --nv:#1a2f52;--bl:#2563eb;--gd:#c9a227;
  --gn:#16a34a;--rd:#dc2626;
  --br:#d6dce8;--mu:#64748b;--lt:#f8fafc;
  --s1:0 2px 10px rgba(26,47,82,.09);
  --s2:0 8px 28px rgba(26,47,82,.14);
}
.scr{display:none}
.scr.on{display:block}
#sl.on{display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#0c1a30 0%,#1a2f52 50%,#1e3870 100%)}
#sa.on,#ss.on{display:flex;flex-direction:column;min-height:100vh}

/* LOGIN */
.lcard{background:#fff;border-radius:18px;width:400px;max-width:95vw;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.32)}
.lhead{background:linear-gradient(135deg,#1a2f52,#2d4a80);padding:36px 32px 26px;text-align:center}
.lbrand{font-size:34px;font-weight:900;letter-spacing:3px;color:#fff}
.lbrand em{color:var(--gd);font-style:normal}
.lsub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:1.5px}
.lbody{padding:28px 30px 30px}
.lbody h3{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:18px;text-align:center}
.fi{margin-bottom:14px}
.fi label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fi input{width:100%;padding:12px 14px;border:2px solid var(--br);border-radius:8px;font-size:15px;outline:none;background:var(--lt);transition:border-color .2s}
.fi input:focus{border-color:var(--bl);background:#fff}
.btn-login{width:100%;padding:13px;background:var(--nv);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-login:hover{background:var(--bl);transform:translateY(-1px)}
.lerr{color:var(--rd);font-size:12px;text-align:center;margin-top:9px;min-height:16px;font-weight:600}
.adm-link{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--br)}
.adm-link a{font-size:12px;color:var(--mu);cursor:pointer;text-decoration:underline dotted}
.adm-link a:hover{color:var(--nv)}
#adm-form{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #eee}

/* TOPBAR */
.tb{background:var(--nv);height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.18);position:sticky;top:0;z-index:200}
.tbbr{font-size:15px;font-weight:900;color:#fff;letter-spacing:.5px}
.tbbr em{color:var(--gd);font-style:normal}
.tbr{display:flex;align-items:center;gap:9px}
.tbwho{font-size:12px;color:rgba(255,255,255,.6)}
.btn-out{padding:5px 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:6px;background:transparent;color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer}
.btn-out:hover{background:rgba(255,255,255,.12)}

/* ADMIN */
.ash{display:flex;flex:1;min-height:calc(100vh - 54px)}
.aside{width:190px;background:#fff;border-right:1px solid var(--br);padding:12px 0;flex-shrink:0}
.asec{font-size:9px;font-weight:800;color:#b0bcc8;text-transform:uppercase;letter-spacing:1.2px;padding:10px 15px 4px}
.ai{display:flex;align-items:center;gap:8px;padding:10px 15px;font-size:13px;font-weight:500;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all .13s}
.ai:hover{background:#f0f5fc;color:var(--nv)}
.ai.on{color:var(--bl);background:#eff4ff;border-left-color:var(--bl);font-weight:700}
.amain{flex:1;padding:22px;overflow-y:auto;background:#eef1f7}

/* STUDENT NAV */
.snav{background:#fff;border-bottom:2px solid var(--br);display:flex;padding:0 16px;overflow-x:auto;flex-shrink:0}
.snb{padding:12px 15px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .13s}
.snb.on{color:var(--bl);border-bottom-color:var(--bl)}
.sbody{flex:1;overflow-y:auto;background:#eef1f7}
.sin{padding:20px;max-width:980px;margin:0 auto}

/* CARDS */
.card{background:#fff;border-radius:10px;border:1px solid var(--br);padding:18px 20px;margin-bottom:14px;box-shadow:var(--s1)}
.ct{font-size:13.5px;font-weight:800;color:var(--nv);margin-bottom:13px;display:flex;align-items:center;gap:6px}
.ct::after{content:"";flex:1;height:1px;background:var(--br);margin-left:7px}
.pgh{margin-bottom:18px}
.pgt{font-size:19px;font-weight:900;color:var(--nv)}
.pgs{font-size:12.5px;color:var(--mu);margin-top:3px}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.sb{background:#fff;border-radius:10px;border:1px solid var(--br);padding:15px 17px;box-shadow:var(--s1)}
.sbn{font-size:26px;font-weight:900;line-height:1}
.sbl{font-size:11px;color:var(--mu);margin-top:4px}
.cn .sbn{color:var(--nv)}.cb .sbn{color:var(--bl)}.cg .sbn{color:var(--gd)}.cs .sbn{color:var(--gn)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.bn{background:var(--nv);color:#fff}.bb{background:var(--bl);color:#fff}
.bg{background:var(--gn);color:#fff}.brd{background:var(--rd);color:#fff}
.bgy{background:#e2e8f0;color:var(--nv)}.bsm{padding:5px 11px;font-size:11.5px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f0f4fa;padding:8px 11px;text-align:left;font-weight:700;color:var(--nv);border-bottom:2px solid var(--br)}
.tbl td{padding:8px 11px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.tbl tr:hover td{background:#f8fafc}

/* BADGES */
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;line-height:1.4}
.bnv{background:#e6edf8;color:#1a2f52}.bbl{background:#dbeafe;color:#1d4ed8}
.bgn{background:#dcfce7;color:#15803d}.brd2{background:#fee2e2;color:#dc2626}
.bgd{background:#fef3c7;color:#92400e}.bgy2{background:#f1f5f9;color:#475569}

/* DROPZONE */
.dz{border:2.5px dashed #93c5fd;border-radius:12px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#f0f7ff;margin-bottom:12px}
.dz:hover,.dz.over{border-color:var(--bl);background:#dbeafe}
.dz-ic{font-size:40px;margin-bottom:9px}
.dz-t{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:4px}
.dz-s{font-size:12.5px;color:var(--mu)}

/* TOAST */
.toast{position:fixed;top:14px;right:14px;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(-8px);transition:all .22s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateY(0)}
.tok{background:var(--gn);color:#fff}.terr{background:var(--rd);color:#fff}.tinf{background:var(--nv);color:#fff}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.mo.open{display:flex}
.mob{background:#fff;border-radius:14px;padding:26px 28px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mot{font-size:16px;font-weight:900;color:var(--nv);margin-bottom:16px}
.mof{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:2px solid var(--br);border-radius:7px;font-size:13px;outline:none;background:var(--lt);transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--bl);background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px}
.empty .ei{font-size:46px;margin-bottom:10px}
.empty p{font-size:14.5px;font-weight:600;color:var(--mu)}

/* ═══ EXAM SHEET ═══ */
.ew{max-width:960px;margin:0 auto}
.tbar{background:#fff;border:1px solid var(--br);border-radius:10px;padding:11px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--s1);flex-wrap:wrap;gap:8px}
.tinfo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tclock{font-size:20px;font-weight:900;color:var(--nv);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.tclock.warn{color:var(--rd);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pinfo{font-size:13px;color:var(--mu)}
.pinfo strong{color:var(--nv);font-size:14px}
.rem{background:#fff8e1;border:1.5px solid var(--gd);border-radius:20px;padding:3px 12px;font-size:11.5px;font-weight:700;color:#92400e}
.tbtns{display:flex;gap:7px;flex-wrap:wrap}
.btn-sub{padding:10px 26px;background:var(--nv);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
.btn-sub:hover{background:var(--bl);transform:translateY(-1px)}

/* PAPER */
.paper{background:#fff;box-shadow:var(--s2)}
.phdr{border:2.5px solid #111;border-bottom:1.5px solid #888;padding:13px 18px}
.pht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.psch{font-size:12px;font-weight:800;color:var(--nv)}
.ptit{font-size:19px;font-weight:900;letter-spacing:2.5px;color:#111;text-align:center;flex:1;margin:0 14px}
.pdat{font-size:11px;color:#777;white-space:nowrap}
.pir{display:flex;align-items:center;justify-content:space-between}
.istrip{display:flex;border:1.5px solid #333}
.ic{display:flex;align-items:center;gap:5px;padding:4px 10px;border-right:1.5px solid #333}
.ic:last-child{border-right:none}
.ic lbl{font-size:10px;font-weight:800;color:#555;white-space:nowrap}
.ifl{border:none;border-bottom:1.5px solid #333;outline:none;font-family:inherit;font-size:12.5px;background:transparent;min-width:50px;padding:1px 3px}
.ptot{font-size:12px;color:#777}
.pbody{border:2.5px solid #111;border-top:none;padding:16px 18px}

/* 2단 배열 */
.p2c{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
/* 문제 블록 */
.pb{padding:12px 0;border-bottom:1px dashed #ccd3e0}
.pb:last-child{border-bottom:none}
.prow{display:flex;gap:9px;align-items:flex-start;margin-bottom:6px}
.pnc{width:24px;height:24px;border-radius:50%;background:var(--nv);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ptxt{font-size:13.5px;line-height:1.75;flex:1;font-weight:600;color:#111}
.ppts{font-size:10.5px;color:#888;margin-left:4px;font-weight:400}
.pmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* 보기 */
.cl{list-style:none;padding:5px 0 0 33px;margin:0}
.ci{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.55;transition:all .12s;user-select:none;margin-bottom:3px;color:#374151;border:1.5px solid transparent}
.ci:hover:not(.fz){background:#f0f5ff;border-color:#c7d7f9}
.ci.sel{background:#dbeafe;border-color:#93c5fd}
.ci.corr{background:#dcfce7 !important;border-color:#86efac !important}
.ci.wrng{background:#fee2e2 !important;border-color:#fca5a5 !important}
.cc{width:22px;height:22px;border-radius:50%;border:1.5px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;color:#666;background:#fff;transition:all .12s}
.ci.sel .cc{background:var(--bl);border-color:var(--bl);color:#fff}
.ci.corr .cc{background:var(--gn);border-color:var(--gn);color:#fff}
.ci.wrng .cc{background:var(--rd);border-color:var(--rd);color:#fff}

/* 주관식 */
.sja{padding:6px 0 0 33px}
.sji{padding:8px 12px;border:2px solid var(--br);border-radius:7px;font-size:14px;outline:none;width:100%;max-width:280px;transition:border-color .2s}
.sji:focus{border-color:var(--bl)}
.sji.corr{border-color:var(--gn);background:#f0fdf4}
.sji.wrng{border-color:var(--rd);background:#fff5f5}

/* 서술형 */
.esa{padding:6px 0 0 33px}
.esi{padding:9px 12px;border:2px solid var(--br);border-radius:7px;font-size:13px;outline:none;width:100%;min-height:90px;resize:vertical;line-height:1.65;transition:border-color .2s}
.esi:focus{border-color:var(--bl)}
.esi.corr{border-color:var(--gn);background:#f0fdf4}
.esi.wrng{border-color:var(--rd);background:#fff5f5}
.ehint{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fbbf24;border-radius:5px;padding:4px 10px;margin-top:6px;display:inline-block}

/* 해설 */
.sol{margin:8px 0 2px 33px;background:#fffbeb;border:1px solid #fbbf24;border-radius:9px;padding:11px 14px;font-size:12.5px;display:none}
.sol.vis{display:block}
.sv{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.sv.ok{color:var(--gn)}.sv.ng{color:var(--rd)}
.sa{font-size:14px;font-weight:800;color:var(--gn);margin-bottom:6px}
.se{color:#374151;line-height:1.7;font-size:12.5px}

/* 주관식 구분선 */
.sdiv{grid-column:1/-1;padding:10px 0 5px;font-size:13px;font-weight:800;color:var(--nv);border-top:2px solid var(--nv);margin-top:8px}

/* 결과 */
.resb{background:linear-gradient(135deg,var(--nv),#2d4a80);color:#fff;border-radius:14px;padding:26px;text-align:center;margin:14px 0;box-shadow:var(--s2)}
.rsc{font-size:58px;font-weight:900;line-height:1}
.rsc sub{font-size:22px;font-weight:400;opacity:.7}
.rpc{font-size:20px;font-weight:700;margin-top:5px}
.rmsg{font-size:15px;margin-top:7px;opacity:.85}
.pbo{background:rgba(255,255,255,.2);border-radius:5px;height:8px;max-width:240px;margin:11px auto 0;overflow:hidden}
.pbi{height:100%;border-radius:5px;transition:width .5s}

/* 오답노트 */
.wni{background:#fff;border:2px solid #fecaca;border-radius:12px;padding:14px 16px;margin-bottom:11px;box-shadow:var(--s1)}
.wnh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.wcnt{background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px}

/* 정복 */
.cqc{background:#fff;border-radius:12px;border:1px solid var(--br);padding:16px 18px;margin-bottom:11px;box-shadow:var(--s1)}
.cqh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cqn{font-size:14.5px;font-weight:800;color:var(--nv)}
.cqs{font-size:11.5px;color:var(--mu);margin-top:2px}
.cqbr{display:flex;align-items:center;gap:9px}
.cqbo{flex:1;background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden}
.cqbi{height:100%;border-radius:4px;transition:width .5s}
.cqp{font-size:14px;font-weight:900;min-width:36px;text-align:right}
.cqft{display:flex;gap:13px;margin-top:9px;font-size:12px;color:var(--mu)}

/* 홈 */
.hero{background:linear-gradient(135deg,#1a2f52,#2d4a80);border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;box-shadow:var(--s2);color:#fff;flex-wrap:wrap;gap:12px}
.hn{font-size:20px;font-weight:900}
.hs2{font-size:12.5px;opacity:.7;margin-top:3px}
.hbig{font-size:46px;font-weight:900;text-align:center;line-height:1}
.hbig sub{font-size:17px;font-weight:400;opacity:.7}
.hlbl{font-size:11px;opacity:.65;text-align:center;margin-top:3px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.hst{background:#fff;border-radius:10px;border:1px solid var(--br);padding:14px 16px;text-align:center;box-shadow:var(--s1)}
.hst .n{font-size:24px;font-weight:900}
.hst .l{font-size:11.5px;color:var(--mu);margin-top:4px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ac{background:#fff;border-radius:12px;border:2px solid var(--br);padding:16px 18px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.ac:hover{border-color:var(--bl);transform:translateY(-2px);box-shadow:var(--s2)}
.acic{font-size:24px;margin-bottom:7px}
.act{font-size:14.5px;font-weight:800;color:var(--nv);margin-bottom:4px}
.acd{font-size:12px;color:var(--mu)}
.setc{background:#fff;border-radius:12px;border:2px solid var(--br);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.setc:hover{border-color:var(--bl);box-shadow:var(--s2)}
.setn{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:5px}
.upok{padding:13px 15px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:9px;font-size:13px;margin-top:11px}

/* 인쇄 */
@media print{
  .tb,.aside,.snav,.tbar,.noprint{display:none !important}
  .pbody{border-top:2.5px solid #111}
  .pb{page-break-inside:avoid}
  .sol{display:block !important}
  body{background:#fff}
  .ew{max-width:100%}
}
@media(max-width:768px){
  .p2c{grid-template-columns:1fr}
  .sg,.hg{grid-template-columns:1fr 1fr}
  .ag{grid-template-columns:1fr}
  .ash{flex-direction:column}
  .aside{width:100%;border-right:none;border-bottom:1px solid var(--br)}
  .r2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="scr" id="sl">
<div class="lcard">
  <div class="lhead">
    <div class="lbrand">EDEN <em>X</em></div>
    <div class="lsub">문제은행 · 학습시스템</div>
  </div>
  <div class="lbody">
    <h3>학생 로그인</h3>
    <div class="fi"><label>이름</label>
      <input id="s-nm" autocomplete="off">
    </div>
    <div class="fi"><label>비밀번호</label>
      <input id="s-pw" type="password">
    </div>
    <button class="btn-login" id="s-login-btn">로그인 →</button>
    <div class="lerr" id="lerr"></div>
    <div class="adm-link">
      <a id="adm-toggle-link">🔒 관리자 로그인</a>
    </div>
    <div id="adm-form">
      <div class="fi"><label>ID</label><input id="a-id" autocomplete="off"></div>
      <div class="fi"><label>비밀번호</label><input id="a-pw" type="password"></div>
      <button class="btn-login" style="background:#374151;margin-top:0" id="a-login-btn">관리자 입장 →</button>
      <div class="lerr" id="alerr"></div>
    </div>
  </div>
</div>
</div>

<!-- ADMIN -->
<div class="scr" id="sa">
  <div class="tb">
    <div class="tbbr">EDEN <em>X</em> · 관리자</div>
    <div class="tbr">
      <span class="tbwho">관리자</span>
      <button class="btn-out" id="adm-logout-btn">로그아웃</button>
    </div>
  </div>
  <div class="ash">
    <div class="aside">
      <div class="asec">메뉴</div>
      <div class="ai on" id="am-dash">📊 대시보드</div>

function startT() { _ts=0; clearInterval(_ti); _ti=setInterval(function(){ _ts++; updT(); },1000); }
function stopT() { clearInterval(_ti); }
function updT() {
  var el = document.getElementById("tc");

  el.textContent = fmtS(_ts);

function fmtS(s) {
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60;
  return (h?String(h).padStart(2,"0")+":":"")
       + String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0");
}
function fmtT(s) {
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60;
  return (h?h+"시간 ":"")+m+"분 "+sc+"초";
}

/* ── TXT 파서 ── */
function readAuto(file, cb) {
  var r = new FileReader();
  r.onload = function(e) {
    var txt = e.target.result;
    var garbled = (txt.match(/[^\u0000-\u00FF\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g)||[]).length;
    var kor = (txt.match(/[\uAC00-\uD7AF]/g)||[]).length;
    if (garbled>30 && kor<5) {
      var r2 = new FileReader();
      r2.onload = function(e2){ cb(e2.target.result); };
      r2.onerror = function(){ cb(txt); };
      try { r2.readAsText(file,"EUC-KR"); } catch(ex) { cb(txt); }
    } else { cb(txt); }
  };
  r.onerror = function(){ cb(""); };
  r.readAsText(file,"UTF-8");
}

function parseTxt(raw) {
  /* 메타 */
  var name="", grade="", type="단원평가", school="";
  var tm = raw.match(/([가-힣A-Za-z\s]+(?:중간고사|기말고사|단원평가|모의고사)[^\n]*)/);
  if (tm) name = tm[1].replace(/[#*_`\[\]IVXLC]+\.\s*/g,"").trim().slice(0,60);
  if (!name) name="업로드 문제집";
  var gm = raw.match(/(\d)학년/); if (gm) grade="중"+gm[1];
  if (/중간고사/.test(raw)) type="중간고사";
  else if (/기말고사/.test(raw)) type="기말고사";
  else if (/모의/.test(raw)) type="모의고사";
  var sm = raw.match(/([가-힣]+(?:중학교|고등학교|초등학교))/); if (sm) school=sm[1];

  /* 정답표 파싱 */
  var ansMap = {};
  var aRaw = (raw.match(/(?:정답표?|Answer Key)[\s\S]{0,2000}/i)||[""])[0];
  var aRe = /(\d+)\s+([①②③④⑤]|\d+(?:\.\d+)?(?:cm|°|점|개|%)?)/g;
  var am;
  while ((am=aRe.exec(aRaw))!==null) {
    var no=parseInt(am[1]), a=am[2].trim();
    var idx="①②③④⑤".indexOf(a);
    if (idx>=0) a=String(idx+1);
    ansMap[no]=a;
  }

  /* 해설 파싱 */
  var expMap = {};
  var eRaw = (raw.match(/(?:전문가\s*상세\s*해설|Expert Commentary|해설)[\s\S]*/i)||[""])[0];
  var eRe = /문항\s*(\d+)[,\s]*(?:\(\d+\))?[^\n]*\n?([\s\S]*?)(?=\n\s*문항\s*\d+|$)/gi;
  var em;
  while ((em=eRe.exec(eRaw))!==null) {
    expMap[parseInt(em[1])] = em[2].replace(/\*/g,"").replace(/^\s*[-·*]\s*/gm,"").trim().slice(0,300);
  }

  /* body 정리 */
  var body = raw;
  body = body.replace(/(?:I|II|III|IV|V)[\.\s]*(?:시험\s*개요|전략|학습\s*가이드|정답|마무리)[\s\S]*?(?=(?:I|II|III|IV|V)[\.\s]|\d+\.\s|$)/gi,"");
  body = body.replace(/영역\s*\d+\s*[:：][^\n]*/g,"");
  body = body.replace(/\[PART\s*\d+\][^\n]*/gi,"");
  body = body.replace(/\[성취기준[^\]]*\]/g,"");
  body = body.replace(/\[채점\s*기준표\][\s\S]*?(?=\n\d+\.|\n\[|\Z)/g,"");
  body = body.replace(/정답:\s*[^\n]*/gi,"");

  /* 문제 파싱 */
  var probs = [];
  var probRe = /(?:^|\n)(\d{1,2})\s*[\.）\)．]\s*([\s\S]+?)(?=\n\s*\d{1,2}\s*[\.）\)．]\s*[^\s]|$)/gm;
  var m;
  while ((m=probRe.exec(body))!==null) {
    var no = parseInt(m[1]);
    if (no<1||no>100) continue;
    var blk = m[2].trim();

    var ptype = "obj";
    if (/\[서술형\]/.test(blk)) ptype="essay";
    else if (/\[단답형\]/.test(blk)) ptype="subj";
    blk = blk.replace(/\[서술형\]|\[단답형\]/g,"").trim();

    var ptsM = blk.match(/\((\d+)점\)/);
    var pts = ptsM ? parseInt(ptsM[1]) : (ptype==="essay"?8:ptype==="subj"?5:4);
    blk = blk.replace(/\(\d+점\)/g,"").trim();

    var choices = [];
    var cRe = /[①②③④⑤]\s*([^①②③④⑤\n]+)/g;
    var cm2;
    while ((cm2=cRe.exec(blk))!==null) {
      choices.push(cm2[1].replace(/\s+/g," ").trim());
    }
    if (choices.length>=2) ptype="obj";

    var q = blk.replace(/[①②③④⑤][^①②③④⑤\n]*/g,"").replace(/\s+/g," ").trim();
    if (!q||q.length<3) continue;

    probs.push({
      id:uid(), type:ptype, no:no, q:q, choices:choices,
      ans:ansMap[no]||"",
      pts:pts, diff:pts>=7?"상":pts>=5?"중":"하",
      tag:"", exp:expMap[no]||""
    });
  }
  probs.sort(function(a,b){ return a.no-b.no; });
  return {name:name, grade:grade, type:type, school:school, problems:probs};
}

function renderPL(s) {
  if (!s.problems.length) return '<p style="font-size:12.5px;color:#888;padding:6px 0">문제 없음</p>';
  var html = "";
  s.problems.slice(0,5).forEach(function(p,i) {
    var ans_txt = "";
    if (p.ans) {
      if (p.type==="obj" && p.choices && p.choices.length) {
        ans_txt = LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
      } else { ans_txt = p.ans; }
    }
    html += '<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 9px;'
      +'border:1px solid var(--br);border-radius:7px;margin-bottom:5px;background:#fff">'
      +'<span style="width:21px;height:21px;border-radius:50%;background:var(--nv);color:#fff;'
      +'font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;'
      +'flex-shrink:0;margin-top:1px">'+p.no+'</span>'
      +'<div style="flex:1">'
      +'<div style="font-size:12.5px;font-weight:600;margin-bottom:3px">'
      +(p.q.length>55?p.q.slice(0,55)+"…":p.q)+'</div>'
      +(p.choices.length?'<div style="font-size:11px;color:#888">'
        +p.choices.slice(0,3).map(function(c,i){return LL[i]+" "+c;}).join("  ")
        +(p.choices.length>3?"…":"")+'</div>':"")
      +(ans_txt?'<div style="font-size:11px;color:var(--gn);margin-top:2px;font-weight:700">정답: '+ans_txt+'</div>':"")
      +'</div>'
      +'<span class="bdg bgy2" style="font-size:10px;flex-shrink:0">'
      +(p.type==="obj"?"객관식":p.type==="essay"?"서술형":"주관식")+'</span></div>';
  });
  if (s.problems.length>5) html += '<div style="font-size:11.5px;color:#888;padding:3px 0">... 외 '+(s.problems.length-5)+'문제</div>';
  return html;
}

/* ── 파일 처리 ── */
function procTxt(raw) {
  if (!raw.trim()) { showToast("파일 읽기 실패","err"); return; }
  var p = parseTxt(raw);
  if (!p.problems.length) { showToast("문제를 찾지 못했습니다","err"); return; }
  var selEl = document.getElementById("up-set");
  var sid = selEl ? selEl.value : "";
  var set = DB.sets.find(function(s){ return s.id===sid; });
  if (!set) {
    set = {id:uid(), name:p.name, grade:p.grade, type:p.type, school:p.school, problems:[]};
    DB.sets.push(set);
  }
  var old = set.problems.length;
  set.problems = p.problems;
  if (p.grade) set.grade=p.grade; if (p.type) set.type=p.type;
  sdb();
  var el = document.getElementById("up-res");
  if (el) {
    el.innerHTML = '<div class="upok">✅ <strong>'+p.problems.length+'문제</strong> 파싱 완료'
      +(old?'<span style="color:#888;margin-left:7px">(기존 '+old+'개 삭제)</span>':"")
      +'<div style="font-size:12px;color:#555;margin-top:5px">'
      +'객관식 '+p.problems.filter(function(x){return x.type==="obj";}).length
      +' / 주관식 '+p.problems.filter(function(x){return x.type==="subj";}).length
      +' / 서술형 '+p.problems.filter(function(x){return x.type==="essay";}).length+'</div>'
      +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn bn bsm" id="dl-btn2">📥 HTML 다운로드</button>'
      +'<button class="btn bb bsm" data-prev="'+set.id+'">👁 바로 풀어보기</button>'
      +'</div></div>';
  }
  showToast(p.problems.length+"문제 업로드 ✅","ok");
}

function impJSON(content) {

    var probs = Array.isArray(d) ? d : (d.problems||[]);
    var selEl = document.getElementById("up-set");
    var sid = selEl ? selEl.value : "";

    set.problems = probs.map(function(p){ return {
      id:uid(), type:p.type||"subj", no:p.no||0,
      q:p.q||p.question||"", choices:p.choices||[],
      ans:String(p.ans||p.answer||""), pts:p.pts||4,
      diff:p.diff||"중", tag:p.tag||"", exp:p.exp||""
    }; });
    sdb();
    var el = document.getElementById("up-res");

/* ── QUIZ ── */
function qSet(sid, wps) {
  var set = DB.sets.find(function(s){ return s.id===sid; });
  var probs = wps || (set ? set.problems.slice() : []);
  if (!probs.length) { showToast("문제 없음","err"); return; }
  APP.q = {sid:sid, probs:probs, ans:{}, done:false, wm:!!wps};
  startT();
  document.getElementById("sb").innerHTML = buildSheet();
}

function buildSheet() {
  var sid = APP.q.sid, probs = APP.q.probs, done = APP.q.done, wm = APP.q.wm;
  var set = DB.sets.find(function(s){ return s.id===sid; }) || {name:"오답재도전",grade:"",type:""};
  var stu = APP.u;
  var now = new Date();
  var ds = now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일";

  var objPs = probs.filter(function(p){ return p.type==="obj"; });
  var subPs = probs.filter(function(p){ return p.type!=="obj"; });
  var totalPts = probs.reduce(function(a,p){ return a+(p.pts||4); },0);
  var ep = 0;
  if (done) probs.forEach(function(p){ if (chk(p, APP.q.ans[p.id])) ep+=(p.pts||4); });
  var pct = done ? Math.round(ep/totalPts*100) : 0;
  var answered = Object.keys(APP.q.ans).length;
  var remain = probs.length - answered;

  var col0 = objPs.filter(function(_,i){ return i%2===0; });
  var col1 = objPs.filter(function(_,i){ return i%2===1; });

  function rP(p, gi) {
    var a = APP.q.ans[p.id];
    var ok = done ? chk(p, a) : false;
    var inp = "";

    if (p.type==="obj") {
      inp = '<ul class="cl">';
      p.choices.forEach(function(c, ci) {
        var cls = "";
        if (done) {
          if ((ci+1)+""===p.ans) cls="corr";
          else if ((ci+1)+""===a) cls="wrng";
        } else if (a===(ci+1)+"") cls="sel";
        inp += '<li class="ci '+cls+(done?" fz":"")+'" data-pid="'+p.id+'" data-v="'+(ci+1)+'">'
          +'<span class="cc">'+LL[ci]+'</span>'
          +'<span>'+c+'</span></li>';
      });
      inp += '</ul>';
    } else if (p.type==="subj") {
      var c2 = done ? (ok?"corr":"wrng") : "";
      inp = '<div class="sja"><input class="sji '+c2+'" id="si-'+p.id+'"'
        +' value="'+(a||"")+'" '+(done?'readonly':'')+' data-pid="'+p.id+'"></div>';
    } else {
      var c2e = done ? (ok?"corr":"wrng") : "";
      inp = '<div class="esa"><textarea class="esi '+c2e+'" id="si-'+p.id+'"'
        +' '+(done?'readonly':'')+' data-pid="'+p.id+'">'+(a||"")+'</textarea>'
        +(!done?'<div class="ehint">📝 서술형: 풀이 과정과 결론을 완전한 문장으로 쓰세요</div>':"")
        +'</div>';
    }

    var solH = "";
    if (done) {
      var ans_disp = "";
      if (p.ans && p.ans!=="(해설 참조)") {
        if (p.type==="obj" && p.choices && p.choices.length) {
          ans_disp = LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
        } else { ans_disp = p.ans; }
      }
      solH = '<div class="sol vis">'
        +'<div class="sv '+(ok?"ok":"ng")+'">'+(ok?"✅ 정답":"❌ 오답")+'</div>'
        +(ans_disp?'<div class="sa">정답: '+ans_disp+'</div>':"")
        +(p.exp?'<div class="se">'+p.exp+'</div>':"")
        +'</div>';
    }

    return '<div class="pb" id="pb-'+p.id+'">'
      +'<div class="prow">'
      +'<div class="pnc">'+(gi+1)+'</div>'
      +'<div class="ptxt">'+p.q+'<span class="ppts">('+( p.pts||4)+'점)</span>'
      +'<div class="pmeta">'
      +(p.tag?'<span class="bdg bgy2" style="font-size:10px">'+p.tag+'</span>':"")
      +diffBdg(p.diff||"중")
      +'<span class="bdg bgy2" style="font-size:10px">'+(p.type==="obj"?"객관식":p.type==="essay"?"서술형":"주관식")+'</span>'
      +'</div></div></div>'
      +inp+solH+'</div>';
  }

  var msg = pct>=90?"🏆 최우수! 완벽!":pct>=80?"🎉 우수!":pct>=60?"💪 오답 복습!":"📚 집중 복습 필요.";
  var resH = "";
  if (done) {
    resH = '<div class="resb">'
      +'<div class="rsc">'+ep+'<sub>/'+totalPts+'점</sub></div>'
      +'<div class="rpc">'+pct+'점 ('+probs.length+'문제)</div>'
      +'<div class="rmsg">'+msg+'</div>'
      +'<div class="pbo"><div class="pbi" style="width:'+pct+'%;background:'+pcolor(pct)+'"></div></div>'
      +(pct<100?'<p style="margin-top:10px;font-size:13px;opacity:.8">❗ 틀린 '+probs.filter(function(p){return !chk(p,APP.q.ans[p.id]);}).length+'문제 → <strong>틀린 것만 다시</strong>로 재도전!</p>':"")
      +'</div>';
  }

  var html = '<div class="ew">'
    +'<div class="tbar noprint">'
    +'<div class="tinfo">'
    +'<div class="tclock">⏱ <span id="tc">'+fmtS(_ts)+'</span></div>'
    +'<div class="pinfo">답변 <strong>'+answered+'</strong>/'+probs.length
    +(!done?'<span class="rem" style="margin-left:7px">남은 '+remain+'문제</span>':"")+'</div></div>'
    +'<div class="tbtns">'
    +'<button class="btn bgy bsm noprint" data-sp="quiz">← 목록</button>'
    +'<button class="btn bgy bsm noprint" id="print-btn">🖨 인쇄</button>'
    +(!done
      ?'<button class="btn-sub" id="sub-btn">📋 전체 답 확인</button>'
      :'<button class="btn brd bsm noprint" id="retry-btn">↺ 틀린 것만 다시</button>'
       +'<button class="btn bg bsm noprint" data-qset="'+sid+'">전체 다시</button>')
    +'</div></div>'

    +'<div class="paper">'
    +'<div class="phdr">'
    +'<div class="pht">'
    +'<div class="psch">이든X학원'+(set.grade?" | "+set.grade:"")+" 수학</div>"
    +'<div class="ptit">'+(wm?"오 답 재 도 전":set.name)+'</div>'
    +'<div class="pdat">'+ds+'</div></div>'
    +'<div class="pir">'
    +'<div class="istrip">'
    +'<div class="ic"><lbl>좌석번호</lbl><input class="ifl" style="width:48px"></div>'
    +'<div class="ic"><lbl>학&nbsp;&nbsp;년</lbl><input class="ifl" style="width:40px"></div>'
    +'<div class="ic"><lbl>이&nbsp;&nbsp;름</lbl><input class="ifl" style="width:68px" value="'+(stu.n!=="미리보기"?stu.n:"")+'"></div>'
    +'</div>'
    +'<div class="ptot">총 '+probs.length+'문제 / '+totalPts+'점 만점</div></div></div>'

    +'<div class="pbody">'
    +(objPs.length
      ?'<div class="p2c"><div class="pcol">'+col0.map(function(p,i){return rP(p,i*2);}).join("")+'</div>'
       +'<div class="pcol">'+col1.map(function(p,i){return rP(p,i*2+1);}).join("")+'</div></div>'
      :"")
    +(subPs.length
      ?'<div class="sdiv">▣ 주관식 · 서술형</div>'+subPs.map(function(p,i){return rP(p,objPs.length+i);}).join("")
      :"")
    +'</div></div>'

    +resH

    +(done?'<div class="tbar noprint" style="margin-top:0">'
      +'<span style="font-size:13px;color:var(--mu)">소요시간 <strong>'+fmtT(_ts)+'</strong> · 결과 <strong>'+pct+'점</strong></span>'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap">'
      +'<button class="btn bgy bsm" data-sp="wrong">오답노트 →</button>'
      +'<button class="btn brd bsm" id="retry-btn2">↺ 틀린 것만</button>'
      +'<button class="btn bn bsm" id="dl-btn3">📥 다운로드</button>'
      +'</div></div>':"")

    +'</div>';
  return html;
}

function chk(p, a) {
  if (!a || a==="") return false;
  if (p.type==="obj") return a===p.ans;
  if (p.type==="essay") return a.trim().length>10;
  return a.trim()===p.ans.trim();
}
function updCnt() {
  var a = Object.keys(APP.q.ans).length, tot = APP.q.probs.length, rem = tot-a;
  var el = document.querySelector(".pinfo");
  if (el) el.innerHTML = '답변 <strong>'+a+'</strong>/'+tot
    +'<span class="rem" style="margin-left:7px">남은 '+rem+'문제</span>';
}
function doSubmit() {
  var ua = APP.q.probs.filter(function(p){ return !APP.q.ans[p.id]; }).length;
  if (ua && !confirm(ua+"문제 미응답입니다. 채점할까요?")) return;
  stopT(); APP.q.done=true;
  var ep=0, tot=0;
  APP.q.probs.forEach(function(p){ tot+=(p.pts||4); if(chk(p,APP.q.ans[p.id])) ep+=(p.pts||4); });
  if (APP.u && APP.u.id!=="__prev__") {
    var now2=new Date();
    var dt=now2.getFullYear()+"."+(now2.getMonth()+1)+"."+now2.getDate()+" "+now2.getHours()+":"+String(now2.getMinutes()).padStart(2,"0");
    DB.recs.push({id:uid(), uid:APP.u.id, sid:APP.q.sid, dt:dt, sc:ep, tot:tot, tm:fmtT(_ts),
      ans:APP.q.probs.map(function(p){ return {pid:p.id, cho:APP.q.ans[p.id]||"", ok:chk(p,APP.q.ans[p.id])}; })});
    sdb();
  }
  showToast("채점 완료! "+ep+"/"+tot+"점 ✅","ok");
  document.getElementById("sb").innerHTML = buildSheet();
}
function doRetry() {
  var wp = APP.q.probs.filter(function(p){ return !chk(p,APP.q.ans[p.id]); });
  if (!wp.length) { showToast("모두 정답! 🎉","ok"); return; }
  APP.q = {sid:APP.q.sid, probs:wp, ans:{}, done:false, wm:true};
  startT(); document.getElementById("sb").innerHTML = buildSheet();
}

/* ── 오답노트 ── */
function rWrong() {
  var u = APP.u;
  var rs = DB.recs.filter(function(r){ return r.uid===u.id; });
  var wm = {};
  rs.forEach(function(r){ (r.ans||[]).forEach(function(a){ if (!a.ok) { if (!wm[a.pid]) wm[a.pid]={cnt:0,sid:r.sid}; wm[a.pid].cnt++; } }); });
  var corr = new Set();
  rs.forEach(function(r){ (r.ans||[]).forEach(function(a){ if (a.ok && wm[a.pid]) corr.add(a.pid); }); });
  var wp = Object.entries(wm).filter(function(e){ return !corr.has(e[0]); }).map(function(e) {
    var id=e[0], info=e[1];
    var set = DB.sets.find(function(s){ return s.id===info.sid; });
    var p = set && set.problems.find(function(pp){ return pp.id===id; });
    return p ? Object.assign({},p,{cnt:info.cnt, sid:info.sid, setName:set.name}) : null;
  }).filter(Boolean);

  if (!wp.length) return '<div class="empty"><div class="ei">🎉</div><p>오답 없음! 완벽합니다!</p></div>';

  var html = '<div style="margin-bottom:16px"><div class="pgt">❌ 오답노트</div>'
    +'<div class="pgs">미정복 <strong>'+wp.length+'</strong>문제</div>'
    +'<button class="btn brd" style="margin-top:10px" id="wq-btn">오답만 다시 풀기 ('+wp.length+'문제) →</button></div>';

  wp.forEach(function(p) {
    var ans_disp = "";
    if (p.ans && p.ans!=="(해설 참조)") {
      if (p.type==="obj" && p.choices && p.choices.length) {
        ans_disp = LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
      } else { ans_disp = p.ans; }
    }
    html += '<div class="wni">'
      +'<div class="wnh"><div style="display:flex;gap:5px;flex-wrap:wrap">'
      +'<span class="bdg bnv">'+p.setName+'</span>'
      +(p.tag?'<span class="bdg bgy2">'+p.tag+'</span>':"")
      +diffBdg(p.diff||"중")+'</div>'
      +'<span class="wcnt">틀린 횟수 '+p.cnt+'</span></div>'
      +'<div style="font-size:14px;font-weight:700;margin-bottom:9px;line-height:1.6">'+p.q+'</div>'
      +(p.type==="obj" && p.choices && p.choices.length
        ?'<ul style="list-style:none;padding-left:10px;font-size:13px;margin-bottom:9px">'
          +p.choices.map(function(c,i){ return '<li style="padding:3px 0;'
            +((i+1)+""===p.ans?"color:var(--gn);font-weight:800":"")+'">'
            +LL[i]+" "+c+'</li>'; }).join("")+'</ul>'
        :"")
      +'<div class="sol vis" style="margin-left:0">'
      +'<div class="sv ok">✅ 정답 및 해설</div>'
      +(ans_disp?'<div class="sa">정답: '+ans_disp+'</div>':"")
      +(p.exp?'<div class="se">'+p.exp+'</div>':"")
      +'</div></div>';
  });
  return html;
}

function doWrongQuiz() {
  var u = APP.u;
  var rs = DB.recs.filter(function(r){ return r.uid===u.id; });
  var wm = {};
  rs.forEach(function(r){ (r.ans||[]).forEach(function(a){ if (!a.ok) wm[a.pid]={sid:r.sid}; }); });
  var corr = new Set();
  rs.forEach(function(r){ (r.ans||[]).forEach(function(a){ if (a.ok && wm[a.pid]) corr.add(a.pid); }); });
  var probs = [];
  Object.entries(wm).filter(function(e){ return !corr.has(e[0]); }).forEach(function(e) {
    var id=e[0], info=e[1];
    var set = DB.sets.find(function(s){ return s.id===info.sid; });
    var p = set && set.problems.find(function(pp){ return pp.id===id; });
    if (p) probs.push(p);
  });

  startT(); document.getElementById("sm-wrong").classList.remove("on");
  document.getElementById("sb").innerHTML = buildSheet();
}

/* ── 정복 현황 ── */
function rConq() {
  var u = APP.u;
  var rs = DB.recs.filter(function(r){ return r.uid===u.id; });
  if (!DB.sets.length) return '<div class="empty"><div class="ei">📭</div><p>문제집 없음</p></div>';
  var html = '<div style="margin-bottom:16px"><div class="pgt">🏆 정복 현황</div><div class="pgs">100%를 향해!</div></div>';
  DB.sets.forEach(function(set) {
    var tot = set.problems.length; if (!tot) return;
    var srs = rs.filter(function(r){ return r.sid===set.id; });
    var sol = new Set();
    srs.forEach(function(r){ (r.ans||[]).forEach(function(a){ if (a.ok) sol.add(a.pid); }); });
    var sc = set.problems.filter(function(p){ return sol.has(p.id); }).length;
    var pct = Math.round(sc/tot*100);
    var best = srs.reduce(function(b,r){ return (!b||r.sc/r.tot>b.sc/b.tot)?r:b; },null);
    var stars = pct>=100?"⭐⭐⭐":pct>=80?"⭐⭐":pct>=50?"⭐":"📚";
    var c = pcolor(pct);
    html += '<div class="cqc">'
      +'<div class="cqh"><div><div class="cqn">'+set.name+'</div>'
      +'<div class="cqs">'+(set.grade||"")+" "+(set.type||"")+" · "+tot+'문제</div></div>'
      +'<div>'+stars+'</div></div>'
      +'<div class="cqbr"><div class="cqbo"><div class="cqbi" style="width:'+pct+'%;background:'+c+'"></div></div>'
      +'<div class="cqp" style="color:'+c+'">'+pct+'%</div></div>'
      +'<div class="cqft"><span>정복 <strong>'+sc+'</strong>/'+tot+'</span>'
      +'<span>응시 <strong>'+srs.length+'</strong>회</span>'
      +(best?'<span>최고 <strong>'+Math.round(best.sc/best.tot*100)+'점</strong></span>':"")+'</div>'
      +(pct<100
        ?'<button class="btn bn bsm" style="margin-top:9px" data-qset="'+set.id+'">계속 도전 →</button>'
        :'<div style="color:var(--gn);font-weight:800;margin-top:9px">🎊 완전 정복!</div>')
      +'</div>';
  });
  return html;
}

/* ── 이벤트 위임 (onclick 인라인 대신) ── */
document.addEventListener("click", function(e) {
  var t = e.target;

  /* 로그인 */
  if (t.id==="s-login-btn") { sLogin(); return; }
  if (t.id==="a-login-btn") { aLogin(); return; }
  if (t.id==="adm-toggle-link") {
    var f=document.getElementById("adm-form");
    f.style.display=f.style.display==="none"?"block":"none"; return;
  }
  if (t.id==="adm-logout-btn" || t.id==="stu-logout-btn") { logout(); return; }

  /* 엔터키 처리 */
  if (t.id==="s-nm"||t.id==="s-pw") { if (e.type==="keydown"&&e.key==="Enter") sLogin(); return; }
  if (t.id==="a-id"||t.id==="a-pw") { if (e.type==="keydown"&&e.key==="Enter") aLogin(); return; }

  /* 관리자 메뉴 */
  if (t.id==="am-dash") { ap("dash"); return; }
  if (t.id==="am-up")   { ap("up");   return; }
  if (t.id==="am-stus") { ap("stus"); return; }
  if (t.id==="am-recs") { ap("recs"); return; }

  /* 학생 메뉴 */
  if (t.id==="sm-home")  { sp("home");  return; }
  if (t.id==="sm-quiz")  { sp("quiz");  return; }
  if (t.id==="sm-wrong") { sp("wrong"); return; }
  if (t.id==="sm-conq")  { sp("conq");  return; }

  /* 모달 */
  if (t.id==="mo-set-cancel") { closeMo("mo-set"); return; }
  if (t.id==="mo-stu-cancel") { closeMo("mo-stu"); return; }
  if (t.id==="mo-set-save") {
    var n=document.getElementById("ms-n").value.trim();
    if (!n){showToast("이름 입력","err");return;}
    DB.sets.push({id:uid(),name:n,grade:document.getElementById("ms-g").value,
      type:document.getElementById("ms-t").value,problems:[]});
    sdb();closeMo("mo-set");showToast("생성 ✅","ok");ap("up");return;
  }
  if (t.id==="mo-stu-save") {
    var sn=document.getElementById("su-n").value.trim();
    var sp2=document.getElementById("su-p").value;
    if (!sn||sp2.length<4){showToast("이름·비번(4자+)","err");return;}
    if (allS().find(function(s){return s.n===sn;})){showToast("이미 있는 이름","err");return;}
    if (!DB.xs)DB.xs=[];
    DB.xs.push({id:uid(),n:sn,pw:sp2,g:document.getElementById("su-g").value});
    sdb();closeMo("mo-stu");showToast("등록 ✅","ok");ap("stus");return;
  }

  /* 동적 버튼 */
  if (t.id==="new-set-btn") { openMo("mo-set"); return; }
  if (t.id==="new-stu-btn") { openMo("mo-stu"); return; }
  if (t.id==="dl-btn"||t.id==="dl-btn2"||t.id==="dl-btn3") { dlHTML(); return; }
  if (t.id==="print-btn") { window.print(); return; }
  if (t.id==="sub-btn") { doSubmit(); return; }
  if (t.id==="retry-btn"||t.id==="retry-btn2") { doRetry(); return; }
  if (t.id==="wq-btn") { doWrongQuiz(); return; }

  /* data 속성 */
  var qset = t.getAttribute("data-qset"); if (qset) { qSet(qset); return; }
  var sp3  = t.getAttribute("data-sp");   if (sp3)  { sp(sp3);   return; }
  var prev = t.getAttribute("data-prev"); if (prev) { prevSet(prev); return; }
  var pl   = t.getAttribute("data-pl");
  if (pl) { var el2=document.getElementById(pl); if(el2)el2.style.display=el2.style.display==="none"?"block":"none"; return; }
  var ds2 = t.getAttribute("data-del-set"); if (ds2) { if(confirm("삭제?")){ DB.sets=DB.sets.filter(function(s){return s.id!==ds2;});DB.recs=DB.recs.filter(function(r){return r.sid!==ds2;});sdb();showToast("삭제","err");ap("up");} return; }
  var dst = t.getAttribute("data-del-stu"); if (dst) { DB.xs=(DB.xs||[]).filter(function(s){return s.id!==dst;});DB.recs=DB.recs.filter(function(r){return r.uid!==dst;});sdb();showToast("삭제","err");ap("stus"); return; }

  /* 보기 선택 */
  var li = t.closest(".ci");
  if (li && !li.classList.contains("fz") && APP.q && !APP.q.done) {
    var pid=li.getAttribute("data-pid"), v=li.getAttribute("data-v");
    APP.q.ans[pid]=v;
    var blk=document.getElementById("pb-"+pid);
    if (blk) blk.querySelectorAll(".ci").forEach(function(el3) {
      var on=el3.getAttribute("data-v")===v;
      el3.className="ci"+(on?" sel":"")+(" "+(el3.getAttribute("data-pid")===pid?"":""));
      el3.className=el3.className.replace(/\s+/g," ").trim();
      if (on) el3.classList.add("sel"); else el3.classList.remove("sel");
      var cc=el3.querySelector(".cc");
      if(cc){cc.style.background=on?"var(--bl)":"";cc.style.borderColor=on?"var(--bl)":"";cc.style.color=on?"#fff":"";}
    });
    updCnt(); return;
  }
});

/* keydown 처리 */
document.addEventListener("keydown", function(e) {
  if (e.key==="Enter") {
    if (e.target.id==="s-nm"||e.target.id==="s-pw") { sLogin(); }
    if (e.target.id==="a-id"||e.target.id==="a-pw") { aLogin(); }
  }
});

/* 파일 드래그&드롭 / 주관식 입력 */
document.addEventListener("input", function(e) {
  var t=e.target;
  if (!APP.q||APP.q.done) return;
  var pid=t.getAttribute("data-pid");
  if (pid) { APP.q.ans[pid]=t.value; updCnt(); }
});
document.addEventListener("dragover", function(e){ var d=document.getElementById("dz"); if(d&&d.contains(e.target)){e.preventDefault();d.classList.add("over");} });
document.addEventListener("dragleave",function(e){ var d=document.getElementById("dz"); if(d&&!d.contains(e.relatedTarget))d.classList.remove("over"); });
document.addEventListener("drop", function(e) {
  var d=document.getElementById("dz");
  if (!d||!d.contains(e.target)) return;
  e.preventDefault(); d.classList.remove("over");
  var f=e.dataTransfer.files[0]; if(!f)return;
  if (f.name.endsWith(".json")) { var r=new FileReader();r.onload=function(ev){impJSON(ev.target.result);};r.readAsText(f,"UTF-8"); }
  else readAuto(f, procTxt);
});
document.addEventListener("change", function(e) {
  if (e.target.id==="fi") {
    var f=e.target.files[0]; if(!f)return; e.target.value="";
    if (f.name.endsWith(".json")){var r=new FileReader();r.onload=function(ev){impJSON(ev.target.result);};r.readAsText(f,"UTF-8");}
    else readAuto(f, procTxt);
  }
});

/* 드롭존 클릭 */
document.addEventListener("click", function(e) {
  var dz=document.getElementById("dz");
  if (dz && dz===e.target || (dz && dz.contains(e.target) && e.target.tagName!=="BUTTON")) {
    var fi=document.getElementById("fi"); if(fi) fi.click();
  }
}, true);

/* INIT */
window.addEventListener("DOMContentLoaded", function() {
  showScr("sl");
});

</script>
