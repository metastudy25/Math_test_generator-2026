<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이든X · 문제은행</title>
<style>
/* ═══ RESET ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕",sans-serif;background:#eef1f7;color:#1e2535;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:root{
  --nv:#1a2f52;--bl:#2563eb;--gd:#c9a227;
  --gn:#16a34a;--rd:#dc2626;
  --br:#d6dce8;--mu:#64748b;--lt:#f8fafc;
  --s1:0 2px 10px rgba(26,47,82,.09);
  --s2:0 8px 28px rgba(26,47,82,.14);
}

/* ═══ SCREENS ═══ */
.scr{display:none}
.scr.on{display:block}
#sl.on{display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#0c1a30 0%,#1a2f52 50%,#1e3870 100%)}
#sa.on,#ss.on{display:flex;flex-direction:column;min-height:100vh}

/* ═══ LOGIN ═══ */
.lcard{background:#fff;border-radius:18px;width:400px;max-width:95vw;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.32)}
.lhead{background:linear-gradient(135deg,#1a2f52,#2d4a80);padding:36px 32px 26px;text-align:center}
.lbrand{font-size:34px;font-weight:900;letter-spacing:3px;color:#fff}
.lbrand em{color:var(--gd);font-style:normal}
.lsub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:1.5px}
.lbody{padding:28px 30px 30px}
.lbody h3{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:18px;text-align:center}
.fi{margin-bottom:14px}
.fi label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fi input{width:100%;padding:12px 14px;border:2px solid var(--br);border-radius:8px;font-size:15px;outline:none;background:var(--lt);transition:border-color .2s}
.fi input:focus{border-color:var(--bl);background:#fff}
.btn-login{width:100%;padding:13px;background:var(--nv);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-login:hover{background:var(--bl);transform:translateY(-1px)}
.lerr{color:var(--rd);font-size:12px;text-align:center;margin-top:9px;min-height:16px;font-weight:600}
.adm-link{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--br)}
.adm-link a{font-size:12px;color:var(--mu);cursor:pointer;text-decoration:underline dotted}
#adm-form{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #eee}

/* ═══ TOPBAR ═══ */
.tb{background:var(--nv);height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.18);position:sticky;top:0;z-index:200}
.tbbr{font-size:15px;font-weight:900;color:#fff;letter-spacing:.5px}
.tbbr em{color:var(--gd);font-style:normal}
.tbr{display:flex;align-items:center;gap:9px}
.tbwho{font-size:12px;color:rgba(255,255,255,.6)}
.btn-out{padding:5px 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:6px;background:transparent;color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer}
.btn-out:hover{background:rgba(255,255,255,.12)}

/* ═══ ADMIN LAYOUT ═══ */
.ash{display:flex;flex:1;min-height:calc(100vh - 54px)}
.aside{width:190px;background:#fff;border-right:1px solid var(--br);padding:12px 0;flex-shrink:0}
.asec{font-size:9px;font-weight:800;color:#b0bcc8;text-transform:uppercase;letter-spacing:1.2px;padding:10px 15px 4px}
.ai{display:flex;align-items:center;gap:8px;padding:10px 15px;font-size:13px;font-weight:500;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all .13s}
.ai:hover{background:#f0f5fc;color:var(--nv)}
.ai.on{color:var(--bl);background:#eff4ff;border-left-color:var(--bl);font-weight:700}
.amain{flex:1;padding:22px;overflow-y:auto;background:#eef1f7}

/* ═══ STUDENT NAV ═══ */
.snav{background:#fff;border-bottom:2px solid var(--br);display:flex;padding:0 16px;overflow-x:auto;flex-shrink:0}
.snb{padding:12px 15px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .13s}
.snb.on{color:var(--bl);border-bottom-color:var(--bl)}
.sbody{flex:1;overflow-y:auto;background:#eef1f7}
.sin{padding:20px;max-width:980px;margin:0 auto}

/* ═══ CARDS ═══ */
.card{background:#fff;border-radius:10px;border:1px solid var(--br);padding:18px 20px;margin-bottom:14px;box-shadow:var(--s1)}
.ct{font-size:13.5px;font-weight:800;color:var(--nv);margin-bottom:13px;display:flex;align-items:center;gap:6px}
.ct::after{content:"";flex:1;height:1px;background:var(--br);margin-left:7px}
.pgh{margin-bottom:18px}
.pgt{font-size:19px;font-weight:900;color:var(--nv)}
.pgs{font-size:12.5px;color:var(--mu);margin-top:3px}

/* ═══ STATS ═══ */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.sb{background:#fff;border-radius:10px;border:1px solid var(--br);padding:15px 17px;box-shadow:var(--s1)}
.sbn{font-size:26px;font-weight:900;line-height:1}
.sbl{font-size:11px;color:var(--mu);margin-top:4px}
.cn .sbn{color:var(--nv)}.cb .sbn{color:var(--bl)}.cg .sbn{color:var(--gd)}.cs .sbn{color:var(--gn)}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.bn{background:var(--nv);color:#fff}.bb{background:var(--bl);color:#fff}
.bg{background:var(--gn);color:#fff}.brd{background:var(--rd);color:#fff}
.bgy{background:#e2e8f0;color:var(--nv)}.bsm{padding:5px 11px;font-size:11.5px}
.bor{background:transparent;border:2px solid var(--nv);color:var(--nv)}

/* ═══ TABLE ═══ */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f0f4fa;padding:8px 11px;text-align:left;font-weight:700;color:var(--nv);border-bottom:2px solid var(--br)}
.tbl td{padding:8px 11px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.tbl tr:hover td{background:#f8fafc}

/* ═══ BADGES ═══ */
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;line-height:1.4}
.bnv{background:#e6edf8;color:#1a2f52}.bbl{background:#dbeafe;color:#1d4ed8}
.bgn{background:#dcfce7;color:#15803d}.brd2{background:#fee2e2;color:#dc2626}
.bgd{background:#fef3c7;color:#92400e}.bgy2{background:#f1f5f9;color:#475569}

/* ═══ DROPZONE ═══ */
.dz{border:2.5px dashed #93c5fd;border-radius:12px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#f0f7ff;margin-bottom:12px}
.dz:hover,.dz.over{border-color:var(--bl);background:#dbeafe}
.dz-ic{font-size:40px;margin-bottom:9px}
.dz-t{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:4px}
.dz-s{font-size:12.5px;color:var(--mu)}

/* ═══ TOAST ═══ */
.toast{position:fixed;top:14px;right:14px;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(-8px);transition:all .22s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateY(0)}
.tok{background:var(--gn);color:#fff}.terr{background:var(--rd);color:#fff}.tinf{background:var(--nv);color:#fff}

/* ═══ MODAL ═══ */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.mo.open{display:flex}
.mob{background:#fff;border-radius:14px;padding:26px 28px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mot{font-size:16px;font-weight:900;color:var(--nv);margin-bottom:16px}
.mof{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--nv);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:2px solid var(--br);border-radius:7px;font-size:13px;outline:none;background:var(--lt);transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--bl);background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ═══ EMPTY ═══ */
.empty{text-align:center;padding:40px 20px}
.empty .ei{font-size:46px;margin-bottom:10px}
.empty p{font-size:14.5px;font-weight:600;color:var(--mu)}

/* ═══ HOME ═══ */
.hero{background:linear-gradient(135deg,#1a2f52,#2d4a80);border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;box-shadow:var(--s2);color:#fff;flex-wrap:wrap;gap:12px}
.hn{font-size:20px;font-weight:900}
.hs2{font-size:12.5px;opacity:.7;margin-top:3px}
.hbig{font-size:46px;font-weight:900;text-align:center;line-height:1}
.hbig sub{font-size:17px;font-weight:400;opacity:.7}
.hlbl{font-size:11px;opacity:.65;text-align:center;margin-top:3px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.hst{background:#fff;border-radius:10px;border:1px solid var(--br);padding:14px 16px;text-align:center;box-shadow:var(--s1)}
.hst .n{font-size:24px;font-weight:900}
.hst .l{font-size:11.5px;color:var(--mu);margin-top:4px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ac{background:#fff;border-radius:12px;border:2px solid var(--br);padding:16px 18px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.ac:hover{border-color:var(--bl);transform:translateY(-2px);box-shadow:var(--s2)}
.acic{font-size:24px;margin-bottom:7px}
.act{font-size:14.5px;font-weight:800;color:var(--nv);margin-bottom:4px}
.acd{font-size:12px;color:var(--mu)}
.setc{background:#fff;border-radius:12px;border:2px solid var(--br);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:var(--s1)}
.setc:hover{border-color:var(--bl);box-shadow:var(--s2)}
.setn{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:5px}
.upok{padding:13px 15px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:9px;font-size:13px;margin-top:11px}

/* ═══════════════════════════════════════
   QUIZ - 화면 표시용 (타이머바 등)
═══════════════════════════════════════ */
.ew{max-width:980px;margin:0 auto}
.tbar{background:#fff;border:1px solid var(--br);border-radius:10px;padding:11px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--s1);flex-wrap:wrap;gap:8px}
.tinfo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tclock{font-size:20px;font-weight:900;color:var(--nv);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.tclock.warn{color:var(--rd);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pinfo{font-size:13px;color:var(--mu)}
.pinfo strong{color:var(--nv);font-size:14px}
.rem{background:#fff8e1;border:1.5px solid var(--gd);border-radius:20px;padding:3px 12px;font-size:11.5px;font-weight:700;color:#92400e}
.tbtns{display:flex;gap:7px;flex-wrap:wrap}
.btn-sub{padding:10px 26px;background:var(--nv);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
.btn-sub:hover{background:var(--bl);transform:translateY(-1px)}

/* 결과 배너 */
.resb{background:linear-gradient(135deg,var(--nv),#2d4a80);color:#fff;border-radius:14px;padding:26px;text-align:center;margin:14px 0;box-shadow:var(--s2)}
.rsc{font-size:58px;font-weight:900;line-height:1}
.rsc sub{font-size:22px;font-weight:400;opacity:.7}
.rpc{font-size:20px;font-weight:700;margin-top:5px}
.rmsg{font-size:15px;margin-top:7px;opacity:.85}
.pbo{background:rgba(255,255,255,.2);border-radius:5px;height:8px;max-width:240px;margin:11px auto 0;overflow:hidden}
.pbi{height:100%;border-radius:5px;transition:width .5s}

/* 오답노트 */
.wni{background:#fff;border:2px solid #fecaca;border-radius:12px;padding:14px 16px;margin-bottom:11px;box-shadow:var(--s1)}
.wnh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.wcnt{background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px}

/* 정복 */
.cqc{background:#fff;border-radius:12px;border:1px solid var(--br);padding:16px 18px;margin-bottom:11px;box-shadow:var(--s1)}
.cqh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cqn{font-size:14.5px;font-weight:800;color:var(--nv)}
.cqs{font-size:11.5px;color:var(--mu);margin-top:2px}
.cqbr{display:flex;align-items:center;gap:9px}
.cqbo{flex:1;background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden}
.cqbi{height:100%;border-radius:4px;transition:width .5s}
.cqp{font-size:14px;font-weight:900;min-width:36px;text-align:right}
.cqft{display:flex;gap:13px;margin-top:9px;font-size:12px;color:var(--mu)}

/* ═══════════════════════════════════════
   A4 시험지 (화면 + 인쇄 공통)
═══════════════════════════════════════ */
.paper-wrap{
  background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,.15);
  margin-bottom:16px;
  /* A4 비율 유지 (화면) */
  width:100%;
  max-width:794px;
  margin-left:auto;
  margin-right:auto;
}

/* ─ 시험지 헤더 ─ */
.ph{border:2.5px solid #111;border-bottom:none;padding:12px 16px}
.ph-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ph-school{font-size:12px;font-weight:800;color:var(--nv)}
.ph-title{font-size:20px;font-weight:900;letter-spacing:3px;color:#111;text-align:center;flex:1;margin:0 12px}
.ph-date{font-size:11px;color:#777;white-space:nowrap}
.ph-info{display:flex;align-items:center;justify-content:space-between}
.istrip{display:flex;border:1.5px solid #333}
.ic{display:flex;align-items:center;gap:5px;padding:4px 10px;border-right:1.5px solid #333}
.ic:last-child{border-right:none}
.ic lbl{font-size:10px;font-weight:800;color:#555;white-space:nowrap}
.ifl{border:none;border-bottom:1.5px solid #333;outline:none;font-family:inherit;font-size:13px;background:transparent;min-width:50px;padding:1px 3px}
.ph-total{font-size:11.5px;color:#666}

/* ─ 문제 영역 ─ */
.pb-area{border:2.5px solid #111;border-top:1.5px solid #999;padding:14px 16px}

/* ─ 2단 배열 ─ */
.col2{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:20px;
}

/* ─ 문제 블록 ─ */
.pb{
  padding:10px 0;
  border-bottom:1px dashed #c8d0dc;
  break-inside:avoid;
  page-break-inside:avoid;
}
.pb:last-child{border-bottom:none}

/* ─ 문제 번호+질문 ─ */
.prow{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.pnc{
  width:22px;height:22px;border-radius:50%;
  background:var(--nv);color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
}
.ptxt{font-size:13px;line-height:1.7;flex:1;font-weight:600;color:#111}
.ppts{font-size:10px;color:#888;margin-left:4px;font-weight:400}

/* ─ 보기 ─ */
.cl{list-style:none;padding:4px 0 0 30px;margin:0}
.ci{
  display:flex;align-items:flex-start;gap:7px;
  padding:4px 7px;border-radius:6px;
  cursor:pointer;font-size:12.5px;line-height:1.5;
  transition:all .12s;user-select:none;
  margin-bottom:2px;color:#374151;
  border:1.5px solid transparent;
}
.ci:hover:not(.fz){background:#f0f5ff;border-color:#c7d7f9}
.ci.sel{background:#dbeafe;border-color:#93c5fd}
.ci.corr{background:#dcfce7 !important;border-color:#86efac !important}
.ci.wrng{background:#fee2e2 !important;border-color:#fca5a5 !important}
.cc{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid #bbb;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;
  flex-shrink:0;color:#666;background:#fff;transition:all .12s;
}
.ci.sel .cc{background:var(--bl);border-color:var(--bl);color:#fff}
.ci.corr .cc{background:var(--gn);border-color:var(--gn);color:#fff}
.ci.wrng .cc{background:var(--rd);border-color:var(--rd);color:#fff}

/* ─ 주관식 ─ */
.sja{padding:5px 0 0 30px}
.sji{padding:7px 11px;border:2px solid var(--br);border-radius:6px;font-size:13.5px;outline:none;width:100%;max-width:260px;transition:border-color .2s}
.sji:focus{border-color:var(--bl)}
.sji.corr{border-color:var(--gn);background:#f0fdf4}
.sji.wrng{border-color:var(--rd);background:#fff5f5}

/* ─ 서술형 ─ */
.esa{padding:5px 0 0 30px}
.esi{padding:8px 11px;border:2px solid var(--br);border-radius:6px;font-size:13px;outline:none;width:100%;min-height:80px;resize:vertical;line-height:1.65;transition:border-color .2s}
.esi:focus{border-color:var(--bl)}
.esi.corr{border-color:var(--gn);background:#f0fdf4}
.esi.wrng{border-color:var(--rd);background:#fff5f5}
.ehint{font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fbbf24;border-radius:5px;padding:3px 9px;margin-top:5px;display:inline-block}

/* ─ 해설 박스 (화면) ─ */
.sol{
  margin:7px 0 2px 30px;
  background:#fffbeb;border:1px solid #fbbf24;
  border-radius:8px;padding:10px 13px;
  font-size:12px;display:none;
}
.sol.vis{display:block}
.sv{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.sv.ok{color:var(--gn)}.sv.ng{color:var(--rd)}
.sa{font-size:13.5px;font-weight:800;color:var(--gn);margin-bottom:5px}
.se{color:#374151;line-height:1.7;font-size:12px}

/* ─ 주관식 섹션 구분 ─ */
.sdiv{
  grid-column:1/-1;
  padding:9px 0 4px;
  font-size:12.5px;font-weight:800;color:var(--nv);
  border-top:2px solid var(--nv);margin-top:8px;
}

/* ═══════════════════════════════════════
   ★★★ 인쇄 스타일 ★★★
   A4 = 210mm × 297mm
   margins: 15mm 각각 → 본문 180mm × 267mm
═══════════════════════════════════════ */
@media print {
  /* 인쇄 시 숨길 요소 */
  .tb, .aside, .snav, .tbar, .noprint,
  #sl, #sa { display:none !important; }

  /* 페이지 설정 */
  @page {
    size: A4 portrait;
    margin: 15mm 15mm 15mm 15mm;
  }

  html, body {
    width: 210mm;
    height: 297mm;
    background: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  /* 학생 화면 전체 표시 */
  #ss.on { display:block !important; }
  .sbody { overflow:visible !important; }
  .sin { padding:0 !important; max-width:100% !important; }

  /* 시험지 래퍼 */
  .ew { max-width:100% !important; margin:0 !important; }
  .paper-wrap {
    width:100% !important;
    max-width:100% !important;
    box-shadow:none !important;
    margin:0 !important;
  }

function readAuto(file, cb) {
  var r = new FileReader();
  r.onload = function(e) {
    var txt = e.target.result;
    var garbled = (txt.match(/[^\u0000-\u00FF\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g)||[]).length;
    var kor = (txt.match(/[\uAC00-\uD7AF]/g)||[]).length;
    if (garbled>30 && kor<5) {
      var r2=new FileReader();
      r2.onload=function(e2){cb(e2.target.result);}; r2.onerror=function(){cb(txt);};
      try{r2.readAsText(file,"EUC-KR");}catch(ex){cb(txt);}
    } else cb(txt);
  };
  r.onerror=function(){cb("");}; r.readAsText(file,"UTF-8");
}

function parseTxt(raw) {
  /* ══ 메타 추출 ══ */
  var name="", grade="", type="단원평가", school="";
  var tm = raw.match(/([가-힣A-Za-z\s]+(?:중간고사|기말고사|단원평가|모의고사|테스트)[^\n]*)/);
  if (tm) name = tm[1].replace(/[#*_`\[\]IVXLC]+\.\s*/g,"").trim().slice(0,60);
  if (!name) name = "업로드 문제집";
  var gm = raw.match(/(\d)학년/); if (gm) grade = "중"+gm[1];
  if (/중간고사/.test(raw)) type="중간고사";
  else if (/기말고사/.test(raw)) type="기말고사";
  else if (/모의/.test(raw)) type="모의고사";
  var sm = raw.match(/([가-힣]+(?:중학교|고등학교|초등학교))/); if (sm) school=sm[1];

  /* ══ 정답표 파싱 ══ */
  var ansMap = {};
  var aSection = (raw.match(/(?:정답표?|정답\s*및|Answer Key)[\s\S]{0,2000}/i)||[""])[0];
  var aRe = /(\d+)\s+([①②③④⑤]|\d+(?:\.\d+)?(?:cm|°|도|개|점|%)?)/g, am;
  while ((am=aRe.exec(aSection))!==null) {
    var idx2="①②③④⑤".indexOf(am[2]);
    ansMap[parseInt(am[1])] = idx2>=0 ? String(idx2+1) : am[2].trim();
  }

  /* ══ 해설 파싱 ══ */
  var expMap = {};
  var eSection = (raw.match(/(?:전문가\s*해설|상세\s*해설|Expert)[\s\S]*/i)||[""])[0];
  var eRe = /문항\s*(\d+)[,\s]*[^\n]*\n?([\s\S]*?)(?=\n\s*문항\s*\d+|$)/gi, em;
  while ((em=eRe.exec(eSection))!==null)
    expMap[parseInt(em[1])] = em[2].replace(/\*/g,"").trim().slice(0,300);

  /* ══ 노이즈 줄 필터 ══ */
  var NOISE = [
    /^\[문항\s*\d+/,            /* [문항 1~30] */
    /^문항\s*\d+[~\-]\d+/,
    /^제\s*\d+\s*단원/,         /* 제2단원: */
    /^\[?\d*\s*영역\]?/,        /* [1영역] */
    /^확인하기$/,
    /^핵심\s*(구성|개념|포인트)/,
    /^합동\s*조건/,
    /^RH[AS]\s*합동/,
    /^Insight/i,
    /^\[정답/,
    /^정답\s*및\s*해설/,
    /^Solution/i,
    /^▶|^►|^●|^■|^□|^※/,
    /^이제\s|^이로써\s|^앞으로\s/,  /* 마무리 문장 */
    /^다음\s*(단원|장|절|파트)/,
    /^PART\s*\d+/i,
    /^\(단,\s/,
    /^즉,\s|^따라서\s/,
    /^위\s*(성질|조건|정의)/,
    /^핵심\s*구성/,
    /중략/,
    /^\.\.\./,
    /^구성\s*요소/,
    /^Insight\s/i,
    /^직각삼각형의\s*합동:/,
    /^이등변삼각형:/,
    /^삼각형의\s*기본/,
  ];
  function isNoise(line) {
    return NOISE.some(function(p){ return p.test(line.trim()); });
  }

  /* ══ 난이도 맵 ══ */
  var DIFF_MAP = {"하":"하","중":"중","상":"상","최상":"최상",
                  "기본":"중","심화":"상","킬러":"최상","쉬움":"하","어려움":"상"};

  /* ══ 문제 파싱 ══ */
  var probs = [];
  var noCounter = 0;
  var lines = raw.split("\n");
  var i = 0;

  function readChoicesFrom(startIdx) {
    var choices = [], li = startIdx;
    while (li < lines.length) {
      var nl = lines[li].trim();
      if (!nl) { li++; continue; }
      if (/[①②③④⑤]/.test(nl)) {
        var cRe = /[①②③④⑤]\s*([^①②③④⑤\n]+)/g, cm;
        while ((cm=cRe.exec(nl))!==null) choices.push(cm[1].trim());
        li++;
        break;
      }
      break;
    }
    return {choices:choices, nextIdx:li};
  }

  while (i < lines.length) {
    var line = lines[i].trim(); i++;
    if (!line || isNoise(line)) continue;

    /* ── 패턴 A: (난이도) 문제내용 ── */
    var mA = line.match(/^\(([하중상최상기본심화킬러쉬움어려움]+)\)\s*(.+)/);
    if (mA) {
      var diff = DIFF_MAP[mA[1]] || "중";
      var q = mA[2].trim();
      /* 보기를 같은 줄에서 추출 */
      var inlineChoices = [];
      var cInRe = /[①②③④⑤]\s*([^①②③④⑤\n]+)/g, cim;
      while ((cim=cInRe.exec(q))!==null) inlineChoices.push(cim[1].trim());
      if (inlineChoices.length) q = q.replace(/[①②③④⑤][^①②③④⑤]*/g,"").trim();

      /* 다음 줄 보기 확인 */
      var extraChoices = [];
      if (inlineChoices.length < 2 && i < lines.length) {
        var res = readChoicesFrom(i);
        extraChoices = res.choices; i = res.nextIdx;
      }
      var choices = inlineChoices.length ? inlineChoices : extraChoices;

      /* 문장이 이어지는 경우 (다음 줄이 같은 문제의 본문) */
      while (i < lines.length) {
        var peek = lines[i].trim();
        if (!peek) { i++; continue; }
        /* 다음 문제 시작이면 break */
        if (/^\([하중상최상기본심화킬러]+\)/.test(peek)) break;
        if (/^\d{1,3}\s*[\.）]/.test(peek) && !isNoise(peek)) break;
        if (/^[①②③④⑤]/.test(peek)) {
          var res2 = readChoicesFrom(i);
          choices = res2.choices; i = res2.nextIdx;
          break;
        }
        /* 노이즈거나 설명문이면 skip */
        if (isNoise(peek) || peek.length > 100) { i++; break; }
        break;
      }

      noCounter++;
      var ptype = choices.length>=2 ? "obj"
        : /서술|증명|과정|기술|설명하|이유|풀이/.test(q) ? "essay" : "subj";
      var pts = ptype==="essay" ? 8 : ptype==="subj" ? 5 : 3;

      probs.push({id:"p"+noCounter, type:ptype, no:noCounter,
        q:q.replace(/\s+/g," ").trim(), choices:choices.slice(0,5),
        ans:ansMap[noCounter]||"", pts:pts, diff:diff, tag:"", exp:expMap[noCounter]||""});
      continue;
    }

    /* ── 패턴 B: 번호. 문제 ── */
    var mB = line.match(/^(\d{1,3})\s*[\.）]\s*(.{4,})/);
    if (mB) {
      var bNo = parseInt(mB[1]);
      var bRaw = mB[2].trim();

      /* 섹션 헤더 제외 */
      if (/단원|영역|문항\s*\d+~|단계|PART|파트|확인|해설|정답/.test(bRaw)) continue;
      /* 개념 설명 제외 */
      if (/^[가-힣]+[이은는]/.test(bRaw) && !/\?|구하|쓰시|서술|증명|계산/.test(bRaw) && bRaw.length<80) continue;

      var bPts = 4;
      var ptsM = bRaw.match(/\((\d+)점\)/); if (ptsM) bPts = parseInt(ptsM[1]);
      var bQ = bRaw.replace(/\(\d+점\)/g,"").trim();

      /* 보기 (인라인) */
      var bChoices = [];
      var bcRe = /[①②③④⑤]\s*([^①②③④⑤\n]+)/g, bcm;
      while ((bcm=bcRe.exec(bQ))!==null) bChoices.push(bcm[1].trim());
      if (bChoices.length) bQ = bQ.replace(/[①②③④⑤][^①②③④⑤]*/g,"").trim();

      /* 보기 (다음 줄) */
      if (bChoices.length < 2 && i < lines.length) {
        var bRes = readChoicesFrom(i);
        if (bRes.choices.length) { bChoices = bRes.choices; i = bRes.nextIdx; }
      }

      var bType = bChoices.length>=2 ? "obj"
        : /서술|증명|과정|기술|설명하|이유|풀이/.test(bQ) ? "essay" : "subj";

      probs.push({id:"p"+bNo, type:bType, no:bNo,
        q:bQ.replace(/\s+/g," ").trim(), choices:bChoices.slice(0,5),
        ans:ansMap[bNo]||"", pts:bPts, diff:"중", tag:"", exp:expMap[bNo]||""});
      continue;
    }
  }

  probs.sort(function(a,b){return a.no-b.no;});
  return {name:name, grade:grade, type:type, school:school, problems:probs};
}

function openEditSet(sid) {
  var set = DB.sets.find(function(s){ return s.id===sid; });
  if (!set) return;
  APP.editSetId = sid;
  document.getElementById("ms-n").value = set.name || "";
  document.getElementById("ms-g").value = set.grade || "";
  document.getElementById("ms-sc").value = set.school || "";
  /* 유형 select */
  var sel = document.getElementById("ms-t");
  for (var i=0; i<sel.options.length; i++) {
    if (sel.options[i].value === set.type) { sel.selectedIndex=i; break; }
  }
  document.querySelector("#mo-set .mot").textContent = "📝 문제집 정보 수정";
  openMo("mo-set");
}
function openNewSet() {
  APP.editSetId = null;
  document.getElementById("ms-n").value="";
  /* 현재 탭 학년을 기본값으로 */
  document.getElementById("ms-g").value = APP._upGrade||"";
  document.getElementById("ms-sc").value="";
  document.getElementById("ms-t").selectedIndex=0;
  document.querySelector("#mo-set .mot").textContent = "📚 새 문제집 만들기";
  openMo("mo-set");
}
function saveSetInfo() {
  var n = document.getElementById("ms-n").value.trim();
  if (!n) { showToast("이름 입력 필요","err"); return; }
  var g = document.getElementById("ms-g").value.trim();
  var t = document.getElementById("ms-t").value;
  var sc = document.getElementById("ms-sc").value.trim();
  if (APP.editSetId) {
    var set = DB.sets.find(function(s){ return s.id===APP.editSetId; });
    if (set) { set.name=n; set.grade=g; set.type=t; set.school=sc; }
    sdb(); closeMo("mo-set"); showToast("수정 완료 ✅","ok"); ap("up");
  } else {
    var newSubj = APP._newSetSubj || APP._upSubj || "수학";
    DB.sets.push({id:uid(),name:n,grade:g,type:t,school:sc,subject:newSubj,problems:[]});
    sdb(); closeMo("mo-set"); showToast("생성 완료 ✅","ok"); ap("up");
  }
}

function buildGradeSummary() {
  var SUBJ_LIST = ["수학","영어","국어","과학","사회"];
  var SUBJ_ICONS = {수학:"🔢",영어:"🔤",국어:"📖",과학:"🔬",사회:"🌍"};
  var SUBJ_CSS = {수학:"s-수학",영어:"s-영어",국어:"s-국어",과학:"s-과학",사회:"s-사회"};
  var GRADES = ["중1","중2","중3","고1","고2","고3","공통"];

  /* 과목별 집계 */
  var subjData = {};
  SUBJ_LIST.forEach(function(s){
    var ss=DB.sets.filter(function(x){return x.subject===s||(!x.subject&&s==="수학");});
    if(ss.length) subjData[s]={sets:ss.length, probs:ss.reduce(function(a,x){return a+x.problems.length;},0)};
  });

  if(!Object.keys(subjData).length) return "";

  var out='<div style="margin-bottom:16px">'
    +'<div style="font-size:13px;font-weight:800;color:var(--nv);margin-bottom:8px">📚 과목별 현황</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">';

  SUBJ_LIST.forEach(function(s){
    if(!subjData[s]) return;
    out+='<div style="background:#fff;border:1px solid var(--br);border-radius:10px;'
      +'padding:10px 14px;display:flex;flex-direction:column;align-items:center;'
      +'min-width:70px;box-shadow:var(--s1);cursor:pointer" data-goto-up-subj="'+s+'">'
      +'<span style="font-size:18px">'+SUBJ_ICONS[s]+'</span>'
      +'<span class="bdg '+SUBJ_CSS[s]+'" style="margin-top:4px;font-size:10.5px">'+s+'</span>'
      +'<div style="font-size:17px;font-weight:900;color:var(--nv);margin-top:4px">'+subjData[s].sets
      +'<span style="font-size:10px;font-weight:400;color:var(--mu)">집</span></div>'
      +'<div style="font-size:11px;color:var(--mu)">'+subjData[s].probs+'문제</div></div>';
  });
  out+='</div></div>';
  return out;
}

function rUp() {
  var SUBJECTS = [
    {id:"수학", icon:"🔢", color:"s-수학"},
    {id:"영어", icon:"🔤", color:"s-영어"},
    {id:"국어", icon:"📖", color:"s-국어"},
    {id:"과학", icon:"🔬", color:"s-과학"},
    {id:"사회", icon:"🌍", color:"s-사회"}
  ];
  var GRADES = ["중1","중2","중3","고1","고2","고3","공통"];

  var curSubj = APP._upSubj || "수학";
  var curGrade = APP._upGrade || "중2";

  function setsOf(subj, grade) {
    return DB.sets.filter(function(s){
      var sm = s.subject===subj || (!s.subject && subj==="수학");
      var gm = grade==="공통"
        ? (!s.grade || !GRADES.slice(0,-1).includes(s.grade))
        : s.grade===grade;
      return sm && gm;
    });
  }

  var h = '<div class="pgh"><div class="pgt">📁 과목·학년별 문제 업로드</div>'
    +'<div class="pgs">과목 선택 → 학년 선택 → 파일 업로드 또는 텍스트 붙여넣기</div></div>';

  /* ── 과목 탭 ── */
  h += '<div class="subj-tabs">';
  SUBJECTS.forEach(function(s){
    var cnt = DB.sets.filter(function(x){
      return x.subject===s.id || (!x.subject && s.id==="수학");
    }).length;
    h += '<button class="subj-tab'+(s.id===curSubj?" on":"")+'" data-subj-tab="'+s.id+'">'
      +'<span class="s-ic">'+s.icon+'</span>'+s.id
      +'<span class="s-cnt'+(cnt===0?" zero":"")+'">'+cnt+'</span></button>';
  });
  h += '</div>';

  /* ── 각 과목 패널 ── */
  SUBJECTS.forEach(function(subj){
    var isSubjOn = subj.id===curSubj;
    h += '<div class="subj-panel'+(isSubjOn?" on":"")+'" id="sp-'+subj.id+'">';

    /* 학년 탭 */
    h += '<div class="inner-grade-tabs">';
    GRADES.forEach(function(g){
      var cnt = setsOf(subj.id, g).length;
      h += '<button class="inner-grade-tab'+(g===curGrade&&isSubjOn?" on":"")+'"'
        +' data-inner-grade="'+g+'" data-for-subj="'+subj.id+'">'
        +g+'<span class="ig-cnt">'+cnt+'</span></button>';
    });
    h += '</div>';

    /* 각 학년 섹션 */
    GRADES.forEach(function(g){
      var isGradeOn = isSubjOn && g===curGrade;
      var secId = "sec-"+subj.id+"-"+g;
      var sets = setsOf(subj.id, g);

      h += '<div class="inner-grade-section'+(isGradeOn?" on":"")+'" id="'+secId+'">';

      /* ── 업로드 박스 ── */
      var boxKey = subj.id+"_"+g;
      h += '<div class="upload-box">'
        +'<div class="upload-box-tabs">'
        +'<button class="upload-box-tab on" data-ubtab="file" data-box="'+boxKey+'">📂 파일 업로드</button>'
        +'<button class="upload-box-tab" data-ubtab="paste" data-box="'+boxKey+'">📋 붙여넣기</button>'
        +'</div>'
        +'<div class="upload-box-body">'

        /* 파일 업로드 탭 */
        +'<div id="ubt-file-'+boxKey+'">'
        +'<div class="dropzone-new" id="dzn-'+boxKey+'" data-subj="'+subj.id+'" data-grade="'+g+'">'
        +'<div class="dz-row">'
        +'<div class="dz-ic2">'+subj.icon+'</div>'
        +'<div class="dz-text">'
        +'<strong>'+subj.id+' '+g+' 문제 파일 업로드</strong>'
        +'<span>TXT / JSON 클릭 또는 드래그 · ANSI/UTF-8 자동 인식</span>'
        +'</div></div></div>'
        +'<input type="file" id="fi-'+boxKey+'" data-subj="'+subj.id+'" data-grade="'+g+'" accept=".txt,.json" style="display:none">'
        +'</div>'

        /* 붙여넣기 탭 */
        +'<div id="ubt-paste-'+boxKey+'" style="display:none">'
        +'<textarea class="paste-area" id="pa-'+boxKey+'"'
        +' placeholder="문제 텍스트를 여기에 붙여넣으세요.&#10;&#10;형식 예시:&#10;1. 다음 중 옳은 것은? (3점)&#10;① 보기1  ② 보기2  ③ 보기3  ④ 보기4  ⑤ 보기5&#10;&#10;2. [단답형] 정답을 구하시오. (5점)&#10;&#10;• 정답표가 포함된 경우 자동 인식됩니다."></textarea>'
        +'<div class="paste-actions">'
        +'<span class="paste-hint">💡 Ctrl+A → Ctrl+C로 복사한 내용을 그대로 붙여넣으세요</span>'
        +'<button class="btn bgy bsm" data-paste-clear="'+boxKey+'">지우기</button>'
        +'<button class="btn bb" data-paste-parse="'+boxKey+'" data-subj="'+subj.id+'" data-grade="'+g+'">📋 미리보기</button>'
        +'<button class="btn bn" data-paste-upload="'+boxKey+'" data-subj="'+subj.id+'" data-grade="'+g+'">✅ 업로드</button>'
        +'</div>'
        +'<div id="pp-'+boxKey+'"></div>'
        +'</div>'

        +'</div></div>'; /* /upload-box-body, upload-box */

      /* ── 직접 만들기 버튼 ── */
      h += '<button class="btn-add-set" data-new-set="'+g+'" data-new-subj="'+subj.id+'">'
        +'＋ '+subj.id+' '+g+' 문제집 직접 만들기</button>';

      /* ── 결과창 ── */
      h += '<div id="res-'+boxKey+'"></div>';

      /* ── 기존 문제집 목록 ── */
      if (sets.length) {
        h += '<div style="margin-top:6px">';
        sets.forEach(function(s){
          h += '<div class="set-item"><div class="set-item-head">'
            +'<div><span class="set-item-name">'+s.name+'</span>'
            +(s.school?'<span class="bdg bgy2" style="margin-left:6px;font-size:10.5px">'+s.school+'</span>':"")
            +'</div><div class="set-item-actions">'
            +'<span class="bdg '+subj.color+'" style="font-size:10.5px">'+subj.id+'</span>'
            +'<span class="bdg bgy2">'+s.type+'</span>'
            +'<button class="btn bor bsm" data-edit-set="'+s.id+'">✏️ 수정</button>'
            +'<button class="btn bgy bsm" data-pl="pl-'+s.id+'">목록</button>'
            +(s.id!=="__P__"?'<button class="btn brd bsm" data-del-set="'+s.id+'">삭제</button>':"")
            +'</div></div>'
            +'<div class="set-item-meta">'
            +'<span>문제 <strong>'+s.problems.length+'</strong>개</span>'
            +'<span>응시 <strong>'+DB.recs.filter(function(r){return r.sid===s.id;}).length+'</strong>회</span>'
            +'<span>'+s.type+'</span></div>'
            +'<div id="pl-'+s.id+'" style="display:none;margin-top:10px">'+renderPL(s)+'</div>'
            +'</div>';
        });
        h += '</div>';
      } else {
        h += '<div style="text-align:center;padding:18px;color:var(--mu);font-size:13px">'
          +'📭 '+subj.id+' '+g+' 문제집이 없습니다.</div>';
      }

      h += '</div>'; /* /inner-grade-section */
    }); /* GRADES forEach */

    h += '</div>'; /* /subj-panel */
  }); /* SUBJECTS forEach */

  return h;
}


function renderPL(s) {
  if (!s.problems.length) return '<p style="font-size:12.5px;color:#888;padding:6px 0">문제 없음</p>';
  var h="";
  s.problems.slice(0,5).forEach(function(p){
    var ad="";

      +'<div style="flex:1"><div style="font-size:12.5px;font-weight:600;margin-bottom:3px">'+(p.q.length>55?p.q.slice(0,55)+"…":p.q)+'</div>'
      +(p.choices.length?'<div style="font-size:11px;color:#888">'+p.choices.slice(0,3).map(function(c,i){return LL[i]+" "+c;}).join("  ")+(p.choices.length>3?"…":"")+'</div>':"")

  if(!p.problems.length){showToast("문제를 찾지 못했습니다","err");return;}
  var selEl=document.getElementById("up-set");
  var sid=selEl?selEl.value:"";

    set={id:uid(),name:p.name,grade:p.grade,type:p.type,school:p.school,problems:[]};
    DB.sets.push(set);
  }
  var old=set.problems.length;
  set.problems=p.problems;
  if(p.grade)set.grade=p.grade; if(p.type)set.type=p.type;

    +' / 서술형 '+p.problems.filter(function(x){return x.type==="essay";}).length+'</div>'

/* 등급 계산 */
function getGrade(pct) {
  if (pct>=90) return "S";
  if (pct>=80) return "A";
  if (pct>=70) return "B";
  if (pct>=60) return "C";
  return "D";
}
function gradeColor(pct) {
  if (pct>=90) return "#7c3aed";
  if (pct>=80) return "#2563eb";
  if (pct>=70) return "#16a34a";
  if (pct>=60) return "#d97706";
  return "#dc2626";
}

function rHome() {
  var u=APP.u;
  var rs=DB.recs.filter(function(r){return r.uid===u.id;});
  rs.sort(function(a,b){return (a.dt||"").localeCompare(b.dt||"");});

  /* 오답 집계 */
  var wm={};
  rs.forEach(function(r){
    (r.ans||[]).forEach(function(a){if(!a.ok)wm[a.pid]=(wm[a.pid]||0)+1;});
  });

    +'</div></div>';

  /* 요약 카드 */
  h += '<div class="grade-grid">'
    +'<div class="grade-box c-bl">'
    +'<div class="gb-n" style="color:var(--bl)">'+rs.length+'</div>'
    +'<div class="gb-l">총 응시 횟수</div>'
    +'<div class="gb-sub">누적 '+tp+'문제 풀이</div></div>'

    +'<div class="grade-box c-gn">'

    +'<div class="gb-l">최고 점수</div>'
    +'<div class="gb-sub">'+(best?(DB.sets.find(function(s){return s.id===best.sid;})||{name:"?"}).name.slice(0,12):"—")+'</div></div>'

    +'<div class="grade-box c-gd">'
    +'<div class="gb-n" style="color:var(--gd)">'+streak+'<span style="font-size:14px;font-weight:400">회</span></div>'
    +'<div class="gb-l">연속 향상</div>'

/* ── 성적 추이 차트 ── */
function buildScoreChart(rs) {
  if (rs.length===0) {
    return '<div class="chart-wrap"><div class="chart-title">📈 성적 추이</div>'
      +'<div class="chart-empty"><div class="ce-ic">📊</div><div>아직 응시 기록이 없습니다</div></div></div>';
  }

  var recent = rs.slice(-10); /* 최근 10회 */
  var W=460, H=130, padL=28, padR=8, padT=12, padB=22;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var n=recent.length;

  /* Y축: 0~100 */
  var pts=recent.map(function(r){return Math.round(r.sc/r.tot*100);});
  var minY=0, maxY=100;

  function xOf(i){return padL + (n<=1 ? plotW/2 : i/(n-1)*plotW);}
  function yOf(v){return padT + plotH - (v-minY)/(maxY-minY)*plotH;}

  /* 그라데이션 path */
  var pathD="", fillD="";
  pts.forEach(function(v,i){
    var x=xOf(i),y=yOf(v);
    pathD += (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1);
    fillD += (i===0?"M":"")+x.toFixed(1)+","+y.toFixed(1)+(i===0?"":" ");
  });
  var lastX=xOf(n-1).toFixed(1);
  fillD += " L"+lastX+","+(padT+plotH)+" L"+xOf(0).toFixed(1)+","+(padT+plotH)+" Z";

  /* 격자선 & Y라벨 */
  var gridHtml="";
  [0,25,50,75,100].forEach(function(v){
    var y=yOf(v);
    gridHtml+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" />';
    gridHtml+='<text class="chart-y" x="'+(padL-3)+'" y="'+(y+3).toFixed(1)+'">'+v+'</text>';
  });

  /* 점 + 날짜 라벨 + 점수 라벨 */
  var dotsHtml="", labelsHtml="", valHtml="";
  pts.forEach(function(v,i){
    var x=xOf(i).toFixed(1),y=yOf(v).toFixed(1);
    var isPerfect=v>=90;
    dotsHtml+='<circle class="chart-dot'+(isPerfect?" perfect":"")
      +'" cx="'+x+'" cy="'+y+'" r="4" title="'+v+'점"/>';
    var dt=(recent[i].dt||"").slice(5,10); /* MM.DD */
    labelsHtml+='<text class="chart-label" x="'+x+'" y="'+(padT+plotH+16)+'">'+(dt||i+1)+'</text>';
    valHtml+='<text class="chart-val" x="'+x+'" y="'+(parseFloat(y)-8)+'">'+(v>=60?v:"")+'</text>';
  });

  var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:'+H+'px">'
    +'<defs><linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>'
    +'<stop offset="100%" stop-color="#2563eb" stop-opacity="0.02"/>'
    +'</linearGradient></defs>'
    +'<g class="chart-grid">'+gridHtml+'</g>'
    +'<path class="chart-fill" d="'+fillD+'"/>'
    +'<path class="chart-path" d="'+pathD+'"/>'
    +dotsHtml+labelsHtml+valHtml
    +'</svg>';

  return '<div class="chart-wrap">'
    +'<div class="chart-title">📈 성적 추이 <span style="font-size:11px;color:var(--mu);font-weight:400">(최근 '+n+'회)</span></div>'
    +'<div>'+svg+'</div>'
    +'<div style="display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--mu)">'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--bl);display:inline-block"></span>응시 점수</span>'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--gn);display:inline-block"></span>90점 이상</span>'
    +'</div></div>';
}

/* ── 문제집별 정확도 바 ── */
function buildAccuracyBars(rs, uid) {
  if (!rs.length) return "";
  var setMap={};
  rs.forEach(function(r){
    if(!setMap[r.sid]) setMap[r.sid]={right:0,total:0,cnt:0};
    setMap[r.sid].right+=r.sc; setMap[r.sid].total+=r.tot; setMap[r.sid].cnt++;
  });
  var entries=Object.entries(setMap);
  if(!entries.length) return "";

  var h='<div class="chart-wrap"><div class="chart-title">📚 문제집별 정확도</div>';
  entries.forEach(function(e){
    var set=DB.sets.find(function(s){return s.id===e[0];})||{name:"?"};
    var pct=Math.round(e[1].right/e[1].total*100);
    h+='<div class="acc-row">'
      +'<div class="acc-label">'+set.name.slice(0,14)+(set.name.length>14?"…":"")+'</div>'
      +'<div class="acc-bar-wrap"><div class="acc-bar" style="width:'+pct+'%;background:'+gradeColor(pct)+'"></div></div>'
      +'<div class="acc-pct" style="color:'+gradeColor(pct)+'">'+pct+'%</div>'
      +'<div class="acc-cnt">'+e[1].cnt+'회</div>'
      +'</div>';
  });
  h+='</div>';
  return h;
}

/* ── 최근 응시 기록 상세 ── */
function buildRecentRecs(rs, uid) {
  if (!rs.length) return "";
  var recent=[].concat(rs).reverse().slice(0,8);
  var h='<div class="rec-table-wrap"><div class="chart-title">📋 응시 기록 상세 <span style="font-size:11px;color:var(--mu);font-weight:400">(클릭하면 문제별 정오답 확인)</span></div>';

  recent.forEach(function(r,i){
    var set=DB.sets.find(function(s){return s.id===r.sid;})||{name:"?"};
    var pct=Math.round(r.sc/r.tot*100);
    var g=getGrade(pct);
    var rankCls=i===0?"gold":i===1?"silver":i===2?"bronze":"";

    /* 문제별 상세 */
    var detailId="det-"+r.id;
    var detailHtml='<div class="detail-panel" id="'+detailId+'">';
    if(r.ans&&r.ans.length){
      r.ans.forEach(function(a){
        var prob=null;
        DB.sets.forEach(function(s){
          var found=s.problems.find(function(p){return p.id===a.pid;});
          if(found) prob=found;
        });
        if(!prob) return;
        detailHtml+='<div class="detail-prob-row">'
          +'<div class="dp-no '+(a.ok?"ok":"ng")+'">'+(prob.no||"?")+'</div>'
          +'<div class="dp-q">'+(prob.q.length>50?prob.q.slice(0,50)+"…":prob.q)+'</div>'
          +'<div class="dp-ans '+(a.ok?"ok":"ng")+'">'
          +(a.ok?"✅ 정답":"❌ "+( prob.type==="obj"&&prob.choices&&prob.choices.length&&prob.ans
            ?["①","②","③","④","⑤"][parseInt(prob.ans)-1]+" "+prob.choices[parseInt(prob.ans)-1]
            :prob.ans||""))
          +'</div></div>';
      });
    } else { detailHtml+='<p style="font-size:12.5px;color:#888">상세 기록 없음</p>'; }
    detailHtml+='</div>';

    h+='<div class="rec-row" data-det="'+detailId+'">'
      +'<div class="rec-rank '+rankCls+'">'+(i+1)+'</div>'
      +'<div class="rec-info">'
      +'<div class="rec-name">'+set.name+'</div>'
      +'<div class="rec-meta">'+r.dt+'  ·  '+r.sc+'/'+r.tot+'문제 정답  ·  <span class="grade-badge gb-'+g+'">'+g+'등급</span></div>'
      +'</div>'
      +'<div class="rec-score">'
      +'<div class="rec-pct" style="color:'+gradeColor(pct)+'">'+pct+'<span style="font-size:12px">점</span></div>'
      +'<div class="rec-time">'+(r.tm||"—")+'</div>'
      +'</div></div>'
      +detailHtml;
  });
  h+='</div>';
  return h;
}

/* ── 관리자: 학생 성적 분석 페이지 ── */
function rGrades() {
  var h='<div class="pgh"><div class="pgt">📊 학생 성적 분석</div>'
    +'<div class="pgs">전체 학생 학습 기록 및 성적 현황</div></div>';

  if(!DB.recs.length){
    return h+'<div class="empty"><div class="ei">📭</div><p>아직 응시 기록이 없습니다</p></div>';
  }

  /* 전체 통계 */
  var totalRecs=DB.recs.length;
  var allPcts=DB.recs.map(function(r){return Math.round(r.sc/r.tot*100);});
  var globalAvg=Math.round(allPcts.reduce(function(a,v){return a+v;},0)/allPcts.length);
  var above80=allPcts.filter(function(v){return v>=80;}).length;
  var below60=allPcts.filter(function(v){return v<60;}).length;

  h+='<div class="grade-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">'
    +'<div class="grade-box c-bl"><div class="gb-n" style="color:var(--bl)">'+totalRecs+'</div><div class="gb-l">총 응시 횟수</div></div>'
    +'<div class="grade-box c-gn"><div class="gb-n" style="color:var(--gn)">'+globalAvg+'<span style="font-size:14px">점</span></div><div class="gb-l">전체 평균</div></div>'
    +'<div class="grade-box c-gd"><div class="gb-n" style="color:var(--gd)">'+above80+'</div><div class="gb-l">80점 이상</div></div>'
    +'<div class="grade-box c-rd"><div class="gb-n" style="color:var(--rd)">'+below60+'</div><div class="gb-l">60점 미만</div></div>'
    +'</div>';

  /* 등급 분포 */
  h+='<div class="chart-wrap"><div class="chart-title">🏅 등급 분포</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">';
  ["S","A","B","C","D"].forEach(function(g){
    var thresholds={S:90,A:80,B:70,C:60,D:0};
    var next={S:101,A:90,B:80,C:70,D:60};
    var cnt=allPcts.filter(function(v){return v>=thresholds[g]&&v<next[g];}).length;
    var pct=Math.round(cnt/totalRecs*100);
    h+='<div style="text-align:center;flex:1;min-width:60px;background:#f8fafc;border-radius:8px;padding:12px 8px;border:1px solid var(--br)">'
      +'<span class="grade-badge gb-'+g+'">'+g+'</span>'
      +'<div style="font-size:20px;font-weight:900;margin-top:6px">'+cnt+'명</div>'
      +'<div style="font-size:11px;color:var(--mu)">'+pct+'%</div></div>';
  });
  h+='</div></div>';

  /* 학생별 성적 카드 */
  h+='<div class="chart-wrap"><div class="chart-title">👥 학생별 성적 현황</div>';

  /* 응시 기록 있는 학생만 */
  var stuWithRecs=allS().filter(function(s){
    return DB.recs.some(function(r){return r.uid===s.id;});
  });
  stuWithRecs.sort(function(a,b){
    var ra=DB.recs.filter(function(r){return r.uid===a.id;});
    var rb=DB.recs.filter(function(r){return r.uid===b.id;});
    var avgA=ra.length?ra.reduce(function(s,r){return s+r.sc/r.tot*100;},0)/ra.length:0;
    var avgB=rb.length?rb.reduce(function(s,r){return s+r.sc/r.tot*100;},0)/rb.length:0;
    return avgB-avgA;
  });

  stuWithRecs.forEach(function(s){
    var rs=DB.recs.filter(function(r){return r.uid===s.id;});
    var avgPct=Math.round(rs.reduce(function(a,r){return a+r.sc/r.tot*100;},0)/rs.length);
    var best=rs.reduce(function(b,r){return(!b||r.sc/r.tot>b.sc/b.tot)?r:b;},null);
    var bestPct=best?Math.round(best.sc/best.tot*100):0;
    var lastRec=rs[rs.length-1];
    var lastPct=lastRec?Math.round(lastRec.sc/lastRec.tot*100):0;
    var wm={};
    rs.forEach(function(r){(r.ans||[]).forEach(function(a){if(!a.ok)wm[a.pid]=(wm[a.pid]||0)+1;});});

    h+='<div class="stu-grade-card">'
      +'<div class="sgc-top">'
      +'<div class="sgc-av">'+s.n[0]+'</div>'
      +'<div><div class="sgc-name">'+s.n+'</div>'
      +'<div class="sgc-meta">응시 '+rs.length+'회 · 오답 '+Object.keys(wm).length+'문제 · 최고 '+bestPct+'점</div></div>'
      +'<div class="sgc-score">'
      +'<div class="sgc-pct" style="color:'+gradeColor(avgPct)+'">'+avgPct+'점</div>'
      +'<span class="grade-badge gb-'+getGrade(avgPct)+'">'+getGrade(avgPct)+'</span></div>'
      +'</div>'
      +'<div class="sgc-bar-row">'
      +'<div class="sgc-bar-out"><div class="sgc-bar-in" style="width:'+avgPct+'%;background:'+gradeColor(avgPct)+'"></div></div>'
      +'<span style="font-size:11.5px;color:var(--mu);min-width:60px;text-align:right">평균 '+avgPct+'%</span>'
      +'</div>'
      +'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">';

    rs.slice(-4).reverse().forEach(function(r){
      var set=DB.sets.find(function(x){return x.id===r.sid;})||{name:"?"};
      var p=Math.round(r.sc/r.tot*100);
      h+='<div style="background:#f8fafc;border:1px solid var(--br);border-radius:6px;padding:5px 9px;font-size:11.5px">'
        +'<span style="color:var(--mu)">'+r.dt.slice(0,10)+'</span> '
        +'<strong style="color:'+gradeColor(p)+'">'+p+'점</strong> '
        +'<span class="grade-badge gb-'+getGrade(p)+'" style="font-size:10px">'+getGrade(p)+'</span></div>';
    });
    h+='</div></div>';
  });

  if(!stuWithRecs.length){
    h+='<div class="empty"><div class="ei">👥</div><p>응시한 학생이 없습니다</p></div>';
  }
  h+='</div>';
  return h;
}

function rQSel() {
  if(!DB.sets.length) return '<div class="empty"><div class="ei">📭</div><p>문제집 없음</p></div>';
  var h='<div style="margin-bottom:16px"><div class="pgt">📝 시험 풀기</div><div class="pgs">문제집을 선택하세요</div></div>';
  DB.sets.forEach(function(s){
    var cnt=DB.recs.filter(function(r){return r.sid===s.id&&r.uid===(APP.u?APP.u.id:"");}).length;
    h+='<div class="setc" data-qset="'+s.id+'">'
      +'<div class="setn">'+s.name+'</div>'
      +'<div style="display:flex;gap:6px;margin-bottom:9px">'
      +(s.grade?'<span class="bdg bnv">'+s.grade+'</span>':"")
      +(s.type?'<span class="bdg bgy2">'+s.type+'</span>':"")+'</div>'
      +'<div style="display:flex;gap:14px;font-size:12.5px;color:var(--mu)">'
      +'<span>문제 <strong style="color:var(--nv)">'+s.problems.length+'</strong>개</span>'
      +'<span>내 응시 <strong>'+cnt+'</strong>회</span></div></div>';
  });
  return h;
}

/* ─────────────────────────────────────────
   QUIZ / buildSheet
───────────────────────────────────────── */
function qSet(sid, wps) {
  var set=DB.sets.find(function(s){return s.id===sid;});
  var probs=wps||(set?set.problems.slice():[]);
  if(!probs.length){showToast("문제 없음","err");return;}
  APP.q={sid:sid,probs:probs,ans:{},done:false,wm:!!wps};
  startT(); document.getElementById("sb").innerHTML=buildSheet();
}

/* ★ 핵심: A4 시험지 빌더 ★ */
function buildSheet() {
  var sid=APP.q.sid,probs=APP.q.probs,done=APP.q.done,wm=APP.q.wm;
  var set=DB.sets.find(function(s){return s.id===sid;})||{name:"오답재도전",grade:"",type:"",school:""};
  var stu=APP.u;
  var now=new Date();
  var ds=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일";

  var objPs=probs.filter(function(p){return p.type==="obj";});
  var subPs=probs.filter(function(p){return p.type!=="obj";});
  var totalPts=probs.reduce(function(a,p){return a+(p.pts||4);},0);
  var ep=0;
  if(done) probs.forEach(function(p){if(chk(p,APP.q.ans[p.id]))ep+=(p.pts||4);});
  var pct=done?Math.round(ep/totalPts*100):0;
  var answered=Object.keys(APP.q.ans).length;
  var remain=probs.length-answered;

  /* 2단: 홀수번 → 왼쪽, 짝수번 → 오른쪽 */
  var col0=objPs.filter(function(_,i){return i%2===0;});
  var col1=objPs.filter(function(_,i){return i%2===1;});

  /* 문제 렌더 */
  function rP(p, gi) {
    var a=APP.q.ans[p.id];
    var ok=done?chk(p,a):false;
    var inp="";

    if (p.type==="obj") {
      inp='<ul class="cl">';
      p.choices.forEach(function(c,ci){
        var cls="";
        if(done){if((ci+1)+""===p.ans)cls="corr";else if((ci+1)+""===a)cls="wrng";}
        else if(a===(ci+1)+"")cls="sel";
        inp+='<li class="ci '+cls+(done?" fz":"")+'" data-pid="'+p.id+'" data-v="'+(ci+1)+'">'
          +'<span class="cc">'+LL[ci]+'</span><span>'+c+'</span></li>';
      });
      inp+='</ul>';
    } else if(p.type==="subj"){
      var c2=done?(ok?"corr":"wrng"):"";
      inp='<div class="sja"><input class="sji '+c2+'" id="si-'+p.id+'"'
        +' value="'+(a||"")+'" '+(done?'readonly':'')+' data-pid="'+p.id+'"></div>';
    } else {
      var c2e=done?(ok?"corr":"wrng"):"";
      inp='<div class="esa"><textarea class="esi '+c2e+'" id="si-'+p.id+'"'
        +' '+(done?'readonly':'')+' data-pid="'+p.id+'">'+(a||"")+'</textarea>'
        +(!done?'<div class="ehint">📝 풀이 과정과 결론을 완전한 문장으로 쓰세요</div>':"")
        +'</div>';
    }

    /* ★ 해설 박스: 화면에서는 채점 후 표시, 인쇄 시 CSS로 강제 표시 ★ */
    var solH="";
    if(done){
      var ad="";
      if(p.ans&&p.ans!=="(해설 참조)"){
        if(p.type==="obj"&&p.choices&&p.choices.length)
          ad=LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
        else ad=p.ans;
      }
      solH='<div class="sol vis">'
        +'<div class="sv '+(ok?"ok":"ng")+'">'+(ok?"✅ 정답":"❌ 오답")+'</div>'
        +(ad?'<div class="sa">정답: '+ad+'</div>':"")
        +(p.exp?'<div class="se">'+p.exp+'</div>':"")
        +'</div>';
    } else {
      /* 채점 전: 해설 박스는 숨겨두되 인쇄 CSS에서 표시됨 */
      var ad2="";
      if(p.ans&&p.ans!=="(해설 참조)"){
        if(p.type==="obj"&&p.choices&&p.choices.length)
          ad2=LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
        else ad2=p.ans;
      }
      solH='<div class="sol" id="sol-'+p.id+'">'
        +'<div class="sv ok">정답 및 해설</div>'
        +(ad2?'<div class="sa">정답: '+ad2+'</div>':"")
        +(p.exp?'<div class="se">'+p.exp+'</div>':"")
        +'</div>';
    }

    return '<div class="pb" id="pb-'+p.id+'">'
      +'<div class="prow">'
      +'<div class="pnc">'+(gi+1)+'</div>'
      +'<div class="ptxt">'+p.q+'<span class="ppts">('+( p.pts||4)+'점)</span></div>'
      +'</div>'
      +inp+solH+'</div>';
  }

  /* 결과 배너 */
  var msg=pct>=90?"🏆 최우수! 완벽!":pct>=80?"🎉 우수!":pct>=60?"💪 오답 복습!":"📚 집중 복습 필요.";
  var resH="";
  if(done){
    resH='<div class="resb noprint">'
      +'<div class="rsc">'+ep+'<sub>/'+totalPts+'점</sub></div>'
      +'<div class="rpc">'+pct+'점 ('+probs.length+'문제)</div>'
      +'<div class="rmsg">'+msg+'</div>'
      +'<div class="pbo"><div class="pbi" style="width:'+pct+'%;background:'+pcolor(pct)+'"></div></div>'
      +(pct<100?'<p style="margin-top:10px;font-size:13px;opacity:.8">❗ 틀린 '+probs.filter(function(p){return !chk(p,APP.q.ans[p.id]);}).length+'문제 → <strong>틀린 것만 다시</strong>로 재도전!</p>':"")
      +'</div>';
  }

  /* ── 최종 HTML ── */
  var h='<div class="ew">'

    /* 타이머 바 (인쇄 시 숨김) */
    +'<div class="tbar noprint">'
    +'<div class="tinfo">'
    +'<div class="tclock">⏱ <span id="tc">'+fmtS(_ts)+'</span></div>'
    +'<div class="pinfo">답변 <strong>'+answered+'</strong>/'+probs.length
    +(!done?'<span class="rem" style="margin-left:7px">남은 '+remain+'문제</span>':"")+'</div></div>'
    +'<div class="tbtns">'
    +'<button class="btn bgy bsm noprint" data-sp="quiz">← 목록</button>'
    +'<button class="btn bgy bsm noprint" id="print-btn">🖨 인쇄 (A4)</button>'
    +(!done
      ?'<button class="btn-sub" id="sub-btn">📋 전체 답 확인</button>'
      :'<button class="btn brd bsm noprint" id="retry-btn">↺ 틀린 것만 다시</button>'
       +'<button class="btn bg bsm noprint" data-qset="'+sid+'">전체 다시</button>')
    +'</div></div>'

    /* ━━━ A4 시험지 ━━━ */
    +'<div class="paper-wrap">'
    +'<div class="ph">'
    +'<div class="ph-top">'
    +'<div class="ph-school">'+(set.school||"이든X학원")+(set.grade?" | "+set.grade+" 수학":"")+'</div>'
    +'<div class="ph-title">'+(wm?"오 답 재 도 전":set.name)+'</div>'
    +'<div class="ph-date">'+ds+'</div>'
    +'</div>'
    +'<div class="ph-info">'
    +'<div class="istrip">'
    +'<div class="ic"><lbl>좌석번호</lbl><input class="ifl" style="width:48px"></div>'
    +'<div class="ic"><lbl>학&nbsp;&nbsp;년</lbl><input class="ifl" style="width:40px"></div>'
    +'<div class="ic"><lbl>이&nbsp;&nbsp;름</lbl><input class="ifl" style="width:68px"'
    +' value="'+(stu.n!=="미리보기"?stu.n:"")+'"></div>'
    +'</div>'
    +'<div class="ph-total">총 '+probs.length+'문제 / '+totalPts+'점 만점</div>'
    +'</div>'
    +'</div>' /* /ph */

    +'<div class="pb-area">'
    /* 객관식 2단 */
    +(objPs.length
      ?'<div class="col2">'
        +'<div>'+col0.map(function(p,i){return rP(p,i*2);}).join("")+'</div>'
        +'<div>'+col1.map(function(p,i){return rP(p,i*2+1);}).join("")+'</div>'
        +'</div>'
      :"")
    /* 주관식·서술형 1단 (구분선) */
    +(subPs.length
      ?'<div style="padding:10px 0 5px;font-size:12.5px;font-weight:800;color:var(--nv);border-top:2px solid var(--nv);margin-top:10px">▣ 주관식 · 서술형</div>'
        +subPs.map(function(p,i){return rP(p,objPs.length+i);}).join("")
      :"")
    +'</div>' /* /pb-area */
    +'</div>' /* /paper-wrap */

    +resH

    +(done?'<div class="tbar noprint" style="margin-top:0">'
      +'<span style="font-size:13px;color:var(--mu)">소요시간 <strong>'+fmtT(_ts)+'</strong> · 결과 <strong>'+pct+'점</strong></span>'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap">'
      +'<button class="btn bgy bsm" data-sp="wrong">오답노트 →</button>'
      +'<button class="btn brd bsm" id="retry-btn2">↺ 틀린 것만</button>'
      +'<button class="btn bgy bsm" id="print-btn2">🖨 인쇄 (정답 포함)</button>'
      +'<button class="btn bn bsm" id="dl-btn3">📥 다운로드</button>'
      +'</div></div>':"")
    +'</div>'; /* /ew */
  return h;
}

/* 채점 */
function chk(p,a) {
  if(!a||a==="")return false;
  if(p.type==="obj")return a===p.ans;
  if(p.type==="essay")return a.trim().length>10;
  return a.trim()===p.ans.trim();
}
function updCnt() {
  var a=Object.keys(APP.q.ans).length,tot=APP.q.probs.length,rem=tot-a;
  var el=document.querySelector(".pinfo");
  if(el)el.innerHTML='답변 <strong>'+a+'</strong>/'+tot
    +'<span class="rem" style="margin-left:7px">남은 '+rem+'문제</span>';
}
function doSubmit() {
  var ua=APP.q.probs.filter(function(p){return !APP.q.ans[p.id];}).length;
  if(ua&&!confirm(ua+"문제 미응답입니다. 채점할까요?"))return;
  stopT(); APP.q.done=true;
  var ep=0,tot=0;
  APP.q.probs.forEach(function(p){tot+=(p.pts||4);if(chk(p,APP.q.ans[p.id]))ep+=(p.pts||4);});
  if(APP.u&&APP.u.id!=="__prev__"){
    var now2=new Date();
    var dt=now2.getFullYear()+"."+(now2.getMonth()+1)+"."+now2.getDate()
      +" "+now2.getHours()+":"+String(now2.getMinutes()).padStart(2,"0");
    DB.recs.push({id:uid(),uid:APP.u.id,sid:APP.q.sid,dt:dt,sc:ep,tot:tot,tm:fmtT(_ts),
      ans:APP.q.probs.map(function(p){return{pid:p.id,cho:APP.q.ans[p.id]||"",ok:chk(p,APP.q.ans[p.id])};})});
    sdb();
  }
  showToast("채점 완료! "+ep+"/"+tot+"점 ✅","ok");
  document.getElementById("sb").innerHTML=buildSheet();
}
function doRetry() {
  var wp=APP.q.probs.filter(function(p){return !chk(p,APP.q.ans[p.id]);});
  if(!wp.length){showToast("모두 정답! 🎉","ok");return;}
  APP.q={sid:APP.q.sid,probs:wp,ans:{},done:false,wm:true};
  startT(); document.getElementById("sb").innerHTML=buildSheet();
}

/* 오답노트 */
function rWrong() {
  var u=APP.u,rs=DB.recs.filter(function(r){return r.uid===u.id;});
  var wm={};
  rs.forEach(function(r){(r.ans||[]).forEach(function(a){if(!a.ok){if(!wm[a.pid])wm[a.pid]={cnt:0,sid:r.sid};wm[a.pid].cnt++;}});});
  var corr=new Set();
  rs.forEach(function(r){(r.ans||[]).forEach(function(a){if(a.ok&&wm[a.pid])corr.add(a.pid);});});
  var wp=Object.entries(wm).filter(function(e){return !corr.has(e[0]);}).map(function(e){
    var set=DB.sets.find(function(s){return s.id===e[1].sid;});
    var p=set&&set.problems.find(function(pp){return pp.id===e[0];});
    return p?Object.assign({},p,{cnt:e[1].cnt,sid:e[1].sid,setName:set.name}):null;
  }).filter(Boolean);
  if(!wp.length)return'<div class="empty"><div class="ei">🎉</div><p>오답 없음! 완벽합니다!</p></div>';
  var h='<div style="margin-bottom:16px"><div class="pgt">❌ 오답노트</div>'
    +'<div class="pgs">미정복 <strong>'+wp.length+'</strong>문제</div>'
    +'<button class="btn brd" style="margin-top:10px" id="wq-btn">오답만 다시 풀기 ('+wp.length+'문제) →</button></div>';
  wp.forEach(function(p){
    var ad="";
    if(p.ans&&p.ans!=="(해설 참조)"){
      if(p.type==="obj"&&p.choices&&p.choices.length)ad=LL[parseInt(p.ans)-1]+" "+p.choices[parseInt(p.ans)-1];
      else ad=p.ans;
    }
    h+='<div class="wni"><div class="wnh"><div style="display:flex;gap:5px;flex-wrap:wrap">'
      +'<span class="bdg bnv">'+p.setName+'</span>'
      +(p.tag?'<span class="bdg bgy2">'+p.tag+'</span>':"")
      +diffBdg(p.diff||"중")+'</div>'
      +'<span class="wcnt">틀린 횟수 '+p.cnt+'</span></div>'
      +'<div style="font-size:14px;font-weight:700;margin-bottom:9px;line-height:1.6">'+p.q+'</div>'
      +(p.type==="obj"&&p.choices&&p.choices.length
        ?'<ul style="list-style:none;padding-left:10px;font-size:13px;margin-bottom:9px">'
          +p.choices.map(function(c,i){return'<li style="padding:3px 0;'+((i+1)+""===p.ans?"color:var(--gn);font-weight:800":"")+'">'
            +LL[i]+" "+c+'</li>';}).join("")+'</ul>':"")
      +'<div class="sol vis" style="margin-left:0"><div class="sv ok">✅ 정답 및 해설</div>'
      +(ad?'<div class="sa">정답: '+ad+'</div>':"")
      +(p.exp?'<div class="se">'+p.exp+'</div>':"")
      +'</div></div>';
  });
  return h;
}
function doWrongQuiz() {
  var u=APP.u,rs=DB.recs.filter(function(r){return r.uid===u.id;});
  var wm={};
  rs.forEach(function(r){(r.ans||[]).forEach(function(a){if(!a.ok)wm[a.pid]={sid:r.sid};});});
  var corr=new Set();
  rs.forEach(function(r){(r.ans||[]).forEach(function(a){if(a.ok&&wm[a.pid])corr.add(a.pid);});});
  var probs=[];
  Object.entries(wm).filter(function(e){return !corr.has(e[0]);}).forEach(function(e){
    var set=DB.sets.find(function(s){return s.id===e[1].sid;});
    var p=set&&set.problems.find(function(pp){return pp.id===e[0];});
    if(p)probs.push(p);
  });
  if(!probs.length){showToast("오답 없음 🎉","ok");return;}
  APP.q={sid:probs[0].sid||"w",probs:probs,ans:{},done:false,wm:true};
  startT();document.getElementById("sm-wrong").classList.remove("on");
  document.getElementById("sb").innerHTML=buildSheet();
}

/* 정복 현황 */
function rConq() {
  var u=APP.u,rs=DB.recs.filter(function(r){return r.uid===u.id;});
  if(!DB.sets.length)return'<div class="empty"><div class="ei">📭</div><p>문제집 없음</p></div>';
  var h='<div style="margin-bottom:16px"><div class="pgt">🏆 정복 현황</div><div class="pgs">100%를 향해!</div></div>';
  DB.sets.forEach(function(set){
    var tot=set.problems.length; if(!tot)return;
    var srs=rs.filter(function(r){return r.sid===set.id;});
    var sol=new Set();
    srs.forEach(function(r){(r.ans||[]).forEach(function(a){if(a.ok)sol.add(a.pid);});});
    var sc=set.problems.filter(function(p){return sol.has(p.id);}).length;
    var pct=Math.round(sc/tot*100);
    var best=srs.reduce(function(b,r){return(!b||r.sc/r.tot>b.sc/b.tot)?r:b;},null);
    var stars=pct>=100?"⭐⭐⭐":pct>=80?"⭐⭐":pct>=50?"⭐":"📚";
    var c=pcolor(pct);
    h+='<div class="cqc"><div class="cqh"><div><div class="cqn">'+set.name+'</div>'
      +'<div class="cqs">'+(set.grade||"")+" "+(set.type||"")+" · "+tot+'문제</div></div>'
      +'<div>'+stars+'</div></div>'
      +'<div class="cqbr"><div class="cqbo"><div class="cqbi" style="width:'+pct+'%;background:'+c+'"></div></div>'
      +'<div class="cqp" style="color:'+c+'">'+pct+'%</div></div>'
      +'<div class="cqft"><span>정복 <strong>'+sc+'</strong>/'+tot+'</span>'
      +'<span>응시 <strong>'+srs.length+'</strong>회</span>'
      +(best?'<span>최고 <strong>'+Math.round(best.sc/best.tot*100)+'점</strong></span>':"")+'</div>'
      +(pct<100
        ?'<button class="btn bn bsm" style="margin-top:9px" data-qset="'+set.id+'">계속 도전 →</button>'
        :'<div style="color:var(--gn);font-weight:800;margin-top:9px">🎊 완전 정복!</div>')
      +'</div>';
  });
  return h;
}

/* ─────────────────────────────────────────
   이벤트 위임 (모든 클릭을 여기서 처리)
───────────────────────────────────────── */
document.addEventListener("click", function(e) {
  var t=e.target.closest("[id],[data-sp],[data-qset],[data-prev],[data-pl],[data-del-set],[data-del-stu],[data-edit-set],.ci,.ac");
  if(!t) return;

  /* 로그인 */
  if(t.id==="s-login-btn"){sLogin();return;}
  if(t.id==="a-login-btn"){aLogin();return;}
  if(t.id==="adm-toggle-link"){var f=document.getElementById("adm-form");f.style.display=f.style.display==="none"?"block":"none";return;}
  if(t.id==="adm-logout-btn"||t.id==="stu-logout-btn"){logout();return;}

  /* 관리자 메뉴 */
  if(t.id==="am-dash"){ap("dash");return;}
  if(t.id==="am-up"){ap("up");return;}
  if(t.id==="am-stus"){ap("stus");return;}
  if(t.id==="am-recs"){ap("recs");return;}
  if(t.id==="am-grades"){ap("grades");return;}

  /* 학생 메뉴 */
  if(t.id==="sm-home"){sp("home");return;}
  if(t.id==="sm-quiz"){sp("quiz");return;}
  if(t.id==="sm-wrong"){sp("wrong");return;}
  if(t.id==="sm-conq"){sp("conq");return;}

  /* 모달 */
  if(t.id==="mo-set-cancel"){closeMo("mo-set");return;}
  if(t.id==="mo-del-cancel"){closeMo("mo-del");_delTargetId=null;return;}
  if(t.id==="mo-del-confirm"){confirmDelete();return;}
  if(t.id==="mo-stu-cancel"){closeMo("mo-stu");return;}
  if(t.id==="mo-set-save"){saveSetInfo();return;}
  if(t.id==="mo-stu-save"){
    var sn=document.getElementById("su-n").value.trim();
    var sp2=document.getElementById("su-p").value;
    if(!sn||sp2.length<4){showToast("이름·비번(4자+)","err");return;}
    if(allS().find(function(s){return s.n===sn;})){showToast("이미 있는 이름","err");return;}
    if(!DB.xs)DB.xs=[];
    DB.xs.push({id:uid(),n:sn,pw:sp2,g:document.getElementById("su-g").value});
    sdb();closeMo("mo-stu");showToast("등록 ✅","ok");ap("stus");return;
  }

  /* 동적 버튼 */
  if(t.id==="new-set-btn"){openNewSet();return;}
  if(t.id==="new-stu-btn"){openMo("mo-stu");return;}
  if(t.id==="dl-btn"||t.id==="dl-btn2"||t.id==="dl-btn3"){dlHTML();return;}
  if(t.id==="print-btn"||t.id==="print-btn2"){window.print();return;}
  if(t.id==="sub-btn"){doSubmit();return;}
  if(t.id==="retry-btn"||t.id==="retry-btn2"){doRetry();return;}
  if(t.id==="wq-btn"){doWrongQuiz();return;}

  /* data 속성 */
  var es=t.getAttribute("data-edit-set"); if(es){openEditSet(es);return;}
  var qset=t.getAttribute("data-qset"); if(qset){qSet(qset);return;}
  var spp=t.getAttribute("data-sp"); if(spp){sp(spp);return;}
  var prev=t.getAttribute("data-prev"); if(prev){prevSet(prev);return;}
  var pl=t.getAttribute("data-pl");
  if(pl){var el2=document.getElementById(pl);if(el2)el2.style.display=el2.style.display==="none"?"block":"none";return;}

  /* 학년 탭 클릭 */
  /* 대시보드 학년 박스 클릭 → 업로드 탭으로 이동 */
  var gotoUp = t.closest("[data-goto-up]");
  if (gotoUp) {
    APP._upGrade = gotoUp.getAttribute("data-goto-up");
    ap("up"); return;
  }

  var gTab = t.getAttribute("data-grade-tab");
  if (gTab) {
    APP._upGrade = gTab;
    ap("up");
    return;
  }

  /* 학년별 새 문제집 만들기 */
  var newSetGrade = t.getAttribute("data-new-set");
  if (newSetGrade) {
    APP._newSetGrade = newSetGrade;
    document.getElementById("ms-g").value = newSetGrade;
    document.querySelector("#mo-set .mot").textContent = "📚 "+newSetGrade+" 문제집 만들기";
    APP.editSetId = null;
    document.getElementById("ms-n").value = "";
    document.getElementById("ms-sc").value = "";
    document.getElementById("ms-t").selectedIndex = 0;
    openMo("mo-set");
    return;
  }

  /* 학년별 드롭존 클릭 */
  var dzGrade = null;
  var dzEl = t.closest(".grade-upload-zone");
  if (dzEl) { dzGrade = dzEl.getAttribute("data-grade"); }
  if (dzGrade) {
    var fi = document.getElementById("fi-"+dzGrade);
    if (fi) fi.click();
    return;
  }

  var dset=t.getAttribute("data-del-set");
  if(dset){if(confirm("삭제?")){ DB.sets=DB.sets.filter(function(s){return s.id!==dset;});DB.recs=DB.recs.filter(function(r){return r.sid!==dset;});sdb();showToast("삭제","err");ap("up");}return;}
  var det=t.getAttribute("data-det");
  if(det){var dp=document.getElementById(det);if(dp)dp.classList.toggle("open");return;}
  var dstu=t.getAttribute("data-del-stu");
  if(dstu){DB.xs=(DB.xs||[]).filter(function(s){return s.id!==dstu;});DB.recs=DB.recs.filter(function(r){return r.uid!==dstu;});sdb();showToast("삭제","err");ap("stus");return;}

  /* 보기 클릭 */
  var li=t.classList.contains("ci")?t:t.closest(".ci");
  if(li&&!li.classList.contains("fz")&&APP.q&&!APP.q.done){
    var pid=li.getAttribute("data-pid"),v=li.getAttribute("data-v");
    APP.q.ans[pid]=v;
    var blk=document.getElementById("pb-"+pid);
    if(blk)blk.querySelectorAll(".ci").forEach(function(el3){
      var on=el3.getAttribute("data-v")===v&&el3.getAttribute("data-pid")===pid;
      if(on){el3.classList.add("sel");el3.classList.remove("corr","wrng");}
      else{el3.classList.remove("sel","corr","wrng");}
      var cc=el3.querySelector(".cc");
      if(cc){cc.style.background=on?"var(--bl)":"";cc.style.borderColor=on?"var(--bl)":"";cc.style.color=on?"#fff":"";}
    });
    updCnt();return;
  }

  /* 홈 카드 클릭 */
  var ac=t.classList.contains("ac")?t:t.closest(".ac");
  if(ac){var ssp=ac.getAttribute("data-sp");if(ssp){sp(ssp);return;}}
});

/* 과목·학년별 드롭존 drag/drop */
document.addEventListener("dragover", function(e) {
  var dz = e.target.closest(".dropzone-new");
  if (dz) { e.preventDefault(); dz.classList.add("over"); }
});
document.addEventListener("dragleave", function(e) {
  var dz = e.target.closest(".dropzone-new");
  if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove("over");
});
document.addEventListener("drop", function(e) {
  var dz = e.target.closest(".dropzone-new");
  if (!dz) return;
  e.preventDefault(); dz.classList.remove("over");
  var subj=dz.getAttribute("data-subj"), grade=dz.getAttribute("data-grade");
  var f=e.dataTransfer.files[0]; if(!f) return;
  if(f.name.endsWith(".json")){
    var r=new FileReader(); r.onload=function(ev){impJSONSubj(ev.target.result,subj,grade);}; r.readAsText(f,"UTF-8");
  } else { readAuto(f,function(raw){procTxtSubj(raw,subj,grade);}); }
});
document.addEventListener("change", function(e) {
  var t=e.target;
  if(t.id && t.id.startsWith("fi-")) {
    var subj=t.getAttribute("data-subj"), grade=t.getAttribute("data-grade");
    var f=t.files[0]; if(!f) return; t.value="";
    if(f.name.endsWith(".json")){
      var r=new FileReader(); r.onload=function(ev){impJSONSubj(ev.target.result,subj,grade);}; r.readAsText(f,"UTF-8");
    } else { readAuto(f,function(raw){procTxtSubj(raw,subj,grade);}); }
  }
});
